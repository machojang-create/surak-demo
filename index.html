<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>

<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Nanum Gothic',sans-serif}
#app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;background:#fff}
#nav{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #eee;flex-shrink:0}
#nav-title{font-size:15px;font-weight:800;color:#222}
#nav-sub{font-size:10px;color:#999;letter-spacing:.5px}
#vtabs{display:flex;border-bottom:1px solid #eee;flex-shrink:0}
.vtab{flex:1;padding:8px 0;text-align:center;font-size:11px;color:#aaa;cursor:pointer;border:none;background:#fff;border-bottom:2px solid transparent}
.vtab.on{color:#2A6E4E;border-bottom:2px solid #2A6E4E;font-weight:700}
.vtab-ic{display:block;font-size:18px;margin-bottom:1px}
#views{flex:1;overflow:hidden;position:relative;min-height:0}
.view{display:none;position:absolute;top:0;left:0;right:0;bottom:0;flex-direction:column;overflow:hidden}
.view.on{display:flex}
#map-filter-bar{flex-shrink:0;display:flex;gap:6px;padding:8px 10px;overflow-x:auto;background:#fff;border-bottom:1px solid #f0f0f0}
#map-filter-bar::-webkit-scrollbar{display:none}
.fcat{font-size:11px;padding:5px 12px;border-radius:20px;border:1px solid #ddd;background:#fff;white-space:nowrap;cursor:pointer;color:#555}
.fcat.on{background:#2A6E4E;color:#fff;border-color:#2A6E4E}
#map-wrap{flex:1;position:relative;min-height:0}
#naver-map{width:100%;height:100%;min-height:300px}
#map-status{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:6px 16px;border-radius:20px;z-index:100;white-space:nowrap;pointer-events:none;transition:opacity .5s}
#list-filter-bar{flex-shrink:0;display:flex;gap:6px;padding:8px 10px;overflow-x:auto;background:#fff;border-bottom:1px solid #f0f0f0}
#list-filter-bar::-webkit-scrollbar{display:none}
#list-items{flex:1;overflow-y:auto;padding:8px 14px 70px}
#pop-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;align-items:flex-end;justify-content:center}
#pop-ov.on{display:flex}
#pop-sheet{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px 18px 34px;max-height:80vh;overflow-y:auto;position:relative}
#pop-x{position:absolute;top:14px;right:16px;font-size:20px;background:none;border:none;cursor:pointer;color:#bbb}
.pop-bar{width:36px;height:4px;background:#eee;border-radius:2px;margin:0 auto 18px}
.pop-badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:6px;color:#fff;margin-bottom:10px}
.pop-name{font-size:18px;font-weight:800;color:#222;margin-bottom:4px}
.pop-addr{font-size:12px;color:#aaa;margin-bottom:6px}
.pop-desc{font-size:13px;color:#555;margin-bottom:12px;line-height:1.6}
.pop-menus{display:flex;flex-direction:column;gap:0}
.pop-menu-row{display:flex;justify-content:space-between;font-size:13px;color:#444;padding:7px 0;border-bottom:1px solid #f5f5f5}

.view-scroll{flex:1;overflow-y:auto;padding:12px 14px 70px}
.wd-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.wd-item{background:#fff;border-radius:8px;padding:8px;text-align:center;border:1px solid #eee}
.wd-lbl{font-size:10px;color:#999;display:block}

.mt-card{background:#f8f9f8;border-radius:12px;padding:14px 16px;margin-bottom:10px}
.mt-hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.mt-ic{font-size:26px}
.mt-name{font-size:14px;font-weight:700;color:#222}
.mt-region{font-size:11px;color:#999;margin-top:2px}
.mt-desc{font-size:12px;color:#555;line-height:1.7;margin-bottom:8px}
.mt-tags{display:flex;flex-wrap:wrap;gap:5px}

.t-card{background:#f8f9f8;border-radius:12px;padding:14px 16px;margin-bottom:10px}
.t-bar{height:4px;border-radius:2px;margin-bottom:10px}
.t-body{padding:0}
.t-row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.t-name{font-size:14px;font-weight:700;color:#222}

.t-route{font-size:12px;color:#555;margin-bottom:4px;line-height:1.6}
.t-gds{font-size:12px;color:#2A6E4E;font-weight:700}
.hw-step{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #f0f0f0}
.hw-num{width:26px;height:26px;border-radius:50%;background:#2A6E4E;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.hw-t{font-size:13px;font-weight:700;color:#222;margin-bottom:2px}
.hw-d{font-size:12px;color:#888}
.goods-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
.goods-item{background:#f8f9f8;border-radius:12px;padding:14px;text-align:center}
.goods-ic{font-size:28px;margin-bottom:6px}
.goods-name{font-size:13px;font-weight:700;color:#222}
.goods-sub{font-size:11px;color:#888;margin-top:2px}
.sp-card{background:#f8f9f8;border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px}
.sp-ic{font-size:22px;flex-shrink:0;margin-top:2px}
.sp-name{font-size:13px;font-weight:700;color:#222}
.sp-desc{font-size:11px;color:#999;margin-top:2px}
.sp-goods{font-size:11px;color:#2A6E4E;margin-top:3px;font-weight:700}
.ds-tag{display:inline-block;background:#e8f5ee;color:#2A6E4E;font-size:11px;padding:3px 9px;border-radius:20px;margin:3px 2px}
.rc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;padding:4px 0}
.rc-ic{font-size:22px}
.rc-t{font-size:12px;font-weight:700;color:#222;margin-top:4px}
.rc-d{font-size:11px;color:#999;margin-top:2px}
.info-card{background:#f8f9f8;border-radius:12px;padding:14px 16px;margin-bottom:10px;font-size:13px;color:#444;line-height:1.8}
.sec-tit{font-size:15px;font-weight:700;color:#222;margin:16px 0 8px}
.sec-tit:first-child{margin-top:0}
.l-card{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f5f5f5;cursor:pointer}
.l-dot{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.l-name{font-size:14px;font-weight:700;color:#222}
.l-sub{font-size:11px;color:#aaa;margin-top:2px}


.pop-tabs{display:flex;gap:0;margin-bottom:14px;border-bottom:2px solid #f0f0f0}
.pop-tab{flex:1;padding:11px 4px;font-size:13px;font-weight:700;border:none;background:none;color:#aaa;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;line-height:1.2}
.pop-tab.on{color:#2A6E4E;border-bottom:3px solid #2A6E4E}
.pop-tab-panel{min-height:60px}
.l-dot{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.l-name{font-size:15px;font-weight:800;color:#222}
.l-sub{font-size:12px;color:#aaa;margin-top:2px}
#pop-sheet{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:22px 20px 40px;max-height:86vh;overflow-y:auto;position:relative}
.fcat{font-size:13px;padding:7px 14px;border-radius:20px;border:1.5px solid #ddd;background:#fff;white-space:nowrap;cursor:pointer;color:#555;font-weight:600}
.fcat.on{background:#2A6E4E;color:#fff;border-color:#2A6E4E}
.sec-tit{font-size:17px;font-weight:800;color:#222;margin:18px 0 10px}
.vtab-ic{display:block;font-size:22px;margin-bottom:2px}
.vtab{flex:1;padding:10px 0;text-align:center;font-size:12px;color:#aaa;cursor:pointer;border:none;background:#fff;border-bottom:2px solid transparent;font-weight:600}
.vtab.on{color:#2A6E4E;border-bottom:2px solid #2A6E4E;font-weight:800}
#nav-title{font-size:16px;font-weight:800;color:#222}

/* 언어 버튼 */
.lang-btn{font-size:11px;padding:5px 8px;border-radius:8px;border:1.5px solid #ddd;background:#fff;color:#666;cursor:pointer;font-weight:600;white-space:nowrap}
.lang-btn.on{background:#2A6E4E;color:#fff;border-color:#2A6E4E}
/* bottom sheet */
#pop-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;align-items:flex-end;justify-content:center;transition:background .3s}
#pop-ov.on{display:flex}
#pop-sheet{background:#fff;width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:0 0 40px;max-height:88vh;overflow-y:auto;position:relative;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.pop-drag-bar{width:48px;height:5px;background:#e0e0e0;border-radius:3px;margin:14px auto 0}
#pop-x{position:absolute;top:12px;right:16px;font-size:22px;background:none;border:none;cursor:pointer;color:#ccc;z-index:10}
.pop-header{padding:16px 20px 12px}
#pop-body{padding:0 20px 10px}
/* 팝업 탭 */
.pop-tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:2px solid #f0f0f0}

.pop-tab.on{color:#2A6E4E;border-bottom:3px solid #2A6E4E}

.fcat{font-size:13px;padding:8px 16px;border-radius:22px;border:1.5px solid #e0e0e0;background:#fff;white-space:nowrap;cursor:pointer;color:#555;font-weight:600}

.vtab{flex:1;padding:10px 0;text-align:center;font-size:12px;color:#bbb;cursor:pointer;border:none;background:#fff;border-bottom:2px solid transparent;font-weight:600}

.sec-tit{font-size:18px;font-weight:800;color:#1a1a1a;margin:20px 0 12px}

.t-stat{font-size:13px;color:#888}
.t-route{font-size:13px;color:#555;margin:6px 0;line-height:1.7}
.t-gds{font-size:13px;color:#2A6E4E;font-weight:700;margin-top:6px}
.t-lv{font-size:11px;padding:3px 9px;border-radius:10px;font-weight:700}
.mt-name{font-size:16px;font-weight:800;color:#1a1a1a}

.goods-name{font-size:15px;font-weight:800;color:#1a1a1a}

#nav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #eee;flex-shrink:0;gap:8px}

<body>
<div id="app">
  <div id="nav">
    <div>
      <div id="nav-title">🐿️ 수락산 · 수락디자인거리</div>
      <div id="nav-sub">SURAKSAN TRAIL &amp; DESIGN STREET</div>
    </div>
    <div id="lang-btns" style="display:flex;gap:4px">
      <button class="lang-btn on" data-lang="KO">한국어</button>
      <button class="lang-btn" data-lang="EN">EN</button>
      <button class="lang-btn" data-lang="JP">日本語</button>
      <button class="lang-btn" data-lang="CN">中文</button>
    </div>
  </div>
  <div id="vtabs">
    <button class="vtab on" data-v="map"><span class="vtab-ic">🗺️</span><span id="t-map">지도</span></button>
    <button class="vtab" data-v="list"><span class="vtab-ic">🏪</span><span id="t-list">매장</span></button>
    <button class="vtab" data-v="goods"><span class="vtab-ic">🎒</span><span id="t-goods">굿즈</span></button>
    <button class="vtab" data-v="trail"><span class="vtab-ic">🥾</span><span id="t-trail">등산</span></button>
    <button class="vtab" data-v="info"><span class="vtab-ic">ℹ️</span><span id="t-info">안내</span></button>
  </div>
  <div id="views">
    <div class="view on" id="map-view">
      <div id="map-filter-bar"></div>
      <div id="map-wrap">
        <div id="naver-map"></div>
        <div id="map-status">🔄 지도 로딩 중...</div>
      </div>
    </div>
    <div class="view" id="list-view">
      <div id="list-filter-bar"></div>
      <div id="list-items"></div>
    </div>
    <div class="view" id="goods-view">
      <div class="view-scroll" id="goods-inner"></div>
    </div>
    <div class="view" id="trail-view">
      <div class="view-scroll" id="trail-inner"></div>
    </div>
    <div class="view" id="info-view">
      <div class="view-scroll" id="info-inner"></div>
    </div>
  </div>

    .replace('서울 노원구 동일로242길','Dongil-ro 242-gil, Nowon-gu, Seoul')

    .replace('서울 노원구 동일로242길','ソウル盧原区東一路242キル')

function fetchWeather(cb){
  var url='https://api.open-meteo.com/v1/forecast?latitude=37.658&longitude=127.063&current=temperature_2m,weathercode,windspeed_10m,relativehumidity_2m&timezone=Asia%2FSeoul';
  fetch(url).then(function(r){return r.json();}).then(function(d){
    var c=d.current;
    cb({temp:Math.round(c.temperature_2m),code:c.weathercode,wind:Math.round(c.windspeed_10m),hum:c.relativehumidity_2m});
  }).catch(function(){cb(null);});
}
function weatherIcon(code){
  if(code===0)return '☀️';if(code<=2)return '⛅';if(code<=3)return '☁️';
  if(code<=48)return '🌫️';if(code<=67)return '🌧️';if(code<=77)return '❄️';
  if(code<=82)return '🌦️';return '⛈️';
}
function weatherDesc(code){
  var WD=WD_MAP[lang]||WD_MAP.KO;
  if(code===0)return WD[0];if(code<=2)return WD[1];if(code<=3)return WD[2];
  if(code<=48)return WD[45];if(code<=67)return WD[61];if(code<=77)return WD[71];
  if(code<=82)return WD[80];return WD[95];
}

var _map=null,_iw=null,_markers=[],_curFilter='all',_done=0,_mapReady=false;

window.naverMapInit=function(){
  _mapReady=true;
  if(document.getElementById('map-view').classList.contains('on')) _initMap();
};
(function(){
  var s=document.createElement('script');
  s.src='https://openapi.map.naver.com/openapi/v3/maps.js?ncpClientId=d7ufdpoww3&submodules=geocoder&callback=naverMapInit';
  s.async=true;
  document.head.appendChild(s);
})();

function _initMap(){
  if(!_mapReady||_map)return;
  _map=new naver.maps.Map('naver-map',{
    center:new naver.maps.LatLng(37.6579,127.0601),
    zoom:16,mapTypeId:naver.maps.MapTypeId.NORMAL
  });
  _iw=new naver.maps.InfoWindow({
    backgroundColor:'#fff',borderColor:'#2A6E4E',borderWidth:2,
    anchorSkew:true,pixelOffset:new naver.maps.Point(0,-8)
  });
  _buildMapFilter();
  _geocodeAll();
}

function _geocodeAll(){
  // localStorage 캐시 확인
  var cached=localStorage.getItem('surak_coords_v7');
  if(cached){
    try{
      JSON.parse(cached).forEach(function(d){
        var s=STORES.find(function(x){return x.id===d.id;});
        if(s){s.lat=d.lat;s.lng=d.lng;}
      });
      STORES.forEach(function(s){if(s.lat&&s.lng)_placeMarker(s);});
      _fitAll();
      var st=document.getElementById('map-status');
      if(st){st.textContent='✅ '+STORES.length+'개 매장';setTimeout(function(){st.style.opacity='0';},2000);}
      return;
    }catch(e){}
  }
  // 신규 변환
  var st=document.getElementById('map-status');
  _done=0;
  var cache={},results=[];
  STORES.forEach(function(s,i){
    setTimeout(function(){
      naver.maps.Service.geocode({query:s.addr},function(status,res){
        if(status===naver.maps.Service.Status.OK&&res.v2.addresses.length>0){
          var r=res.v2.addresses[0];
          var key=r.y+'_'+r.x;
          if(!cache[key])cache[key]=0;
          var n=cache[key]++;
          var ang=n*(Math.PI*2/8),dist=n>0?0.00008:0;
          s.lat=parseFloat(r.y)+dist*Math.cos(ang);
          s.lng=parseFloat(r.x)+dist*Math.sin(ang);
          results.push({id:s.id,lat:s.lat,lng:s.lng});
          if(_curFilter==='all'||s.cat===_curFilter) _placeMarker(s);
        }
        _done++;
        if(st) st.textContent='🔄 주소 변환 중... '+_done+'/'+STORES.length;
        if(_done===STORES.length){
          localStorage.setItem('surak_coords_v7',JSON.stringify(results));
          _fitAll();
          if(st){st.textContent='✅ '+STORES.length+'개 매장';setTimeout(function(){st.style.opacity='0';},2000);}
        }
      });
    },i*120);
  });
}

function _placeMarker(s){
  var cat=CATS[s.cat]||CATS.food;
  var m=new naver.maps.Marker({
    position:new naver.maps.LatLng(s.lat,s.lng),map:_map,
    icon:{
      content:'<div style="cursor:pointer;width:36px;height:36px;background:'+cat.color
        +';border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center'
        +';justify-content:center;border:2.5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35)">'
        +'<span style="transform:rotate(45deg);font-size:16px;line-height:1">'+cat.icon+'</span></div>',
      anchor:new naver.maps.Point(18,36)
    },title:s.ko
  });
  naver.maps.Event.addListener(m,'click',function(){
    _map.panTo(new naver.maps.LatLng(s.lat,s.lng));
    openPopup(s);
  });
  s._marker=m; _markers.push(m);
}

function _fitAll(){
  var pts=STORES.filter(function(s){return s.lat&&s.lng;});
  if(!pts.length)return;
  var lats=pts.map(function(s){return s.lat;}),lngs=pts.map(function(s){return s.lng;});
  _map.fitBounds(new naver.maps.LatLngBounds(
    new naver.maps.LatLng(Math.min.apply(null,lats),Math.min.apply(null,lngs)),
    new naver.maps.LatLng(Math.max.apply(null,lats),Math.max.apply(null,lngs))
  ),{top:50,right:30,bottom:50,left:30});
}

function _renderMarkers(){
  _markers.forEach(function(m){m.setMap(null);}); _markers=[];
  STORES.forEach(function(s){
    if(!s.lat||!s.lng)return;
    if(_curFilter!=='all'&&s.cat!==_curFilter)return;
    _placeMarker(s);
  });
}

function _buildMapFilter(){
  var bar=document.getElementById('map-filter-bar');
  if(!bar)return;
  bar.innerHTML='';
  function btn(k,label){
    var b=document.createElement('button');
    b.className='fcat'+(k===_curFilter?' on':'');
    b.textContent=label;
    b.onclick=function(){_curFilter=k;_buildMapFilter();_renderMarkers();};
    bar.appendChild(b);
  }
  btn('all',T('all')+' '+STORES.length);
  Object.keys(CATS).forEach(function(k){
    var cnt=STORES.filter(function(s){return s.cat===k;}).length;
    if(cnt>0) btn(k,CATS[k].icon+' '+T(k)+' '+cnt);
  });
}

function buildFilter(barId,cb){
  var bar=document.getElementById(barId);if(!bar)return;
  bar.innerHTML='';
  ['all'].concat(GCATS.filter(function(x){return x!=='all';})).forEach(function(k){
    var cnt=k==='all'?STORES.length:STORES.filter(function(s){return gk(s)===k;}).length;
    var btn=mk('button','fcat'+(curGf===k?' on':''));
    btn.innerHTML=(GICONS[k]||'🏔️')+' '+T(k)+'<small style="margin-left:3px;opacity:.7">'+cnt+'</small>';
    btn.addEventListener('click',function(){curGf=k;cb();});
    btn.addEventListener('touchend',function(e){e.preventDefault();curGf=k;cb();});
    bar.appendChild(btn);
  });
}

function buildListFilter(){
  var bar=document.getElementById('list-filter-bar');
  if(!bar)return;
  bar.innerHTML='';
  var cats=['all','food','gogi','cafe','bar'];
  cats.forEach(function(k){
    var cnt=k==='all'?STORES.length:STORES.filter(function(s){return s.cat===k;}).length;
    if(k!=='all'&&cnt===0)return;
    var btn=document.createElement('button');
    btn.className='fcat'+(curListFilter===k?' on':'');
    var label=k==='all'?(T('all')+' '+cnt):(CATS[k].icon+' '+T(k)+' '+cnt);
    btn.textContent=label;
    btn.addEventListener('click',function(){
      curListFilter=k;
      buildListFilter();
      renderList();
    });
    bar.appendChild(btn);
  });
}

  pb.innerHTML=html;

  if(cbtn){cbtn.addEventListener('click',function(){
    var k=this.getAttribute('data-gkey');
    var now=toggleGoods(k);

// ── 번역 적용 ──
function applyT(){

  var _h = [
    ['h-goods-col','goodsColTit'],
    ['h-cs-col-lbl','csColLbl'],
    ['h-cs-cert-lbl','csCertLbl'],
    ['h-cs-pct-lbl','csPctLbl'],
    ['h-goods-cat-tit','goodsCatTit'],
    ['h-cert-pts-tit','certPtsTit'],
  ];

    var el=document.getElementById(pair[0]);
    if(el) el.textContent=T(pair[1]);
  });
  se('t-map',T('tmap')); se('t-list',T('tlist')); se('t-goods',T('tgoods'));
  se('t-trail',T('ttrail')); se('t-info',T('navInfo'));
  se('nav-title',T('title'));

  if(g('wd-lbl-hum'))g('wd-lbl-hum').textContent=T('wdHum');
  if(g('wd-lbl-wind'))g('wd-lbl-wind').textContent=T('wdWind');
  if(g('wd-lbl-sunset'))g('wd-lbl-sunset').textContent=T('wdSunset');
  if(g('wd-lbl-hiking'))g('wd-lbl-hiking').textContent=T('wdHiking');

  document.querySelectorAll('.lang-btn').forEach(function(b){
    b.classList.toggle('on', b.dataset.lang===lang);
  });
  initCheonBanner();
}
// ── 천상병 롤링 배너 초기화 ──
function initCheonBanner(){
  var ticker=document.getElementById('cheon-ticker');
  if(!ticker)return;
  var poems=CHEON_POEMS;
  var text=poems.map(function(p){
    var txt=lang==='KO'?p.ko:lang==='EN'?p.en:lang==='JP'?p.jp:p.cn;
    return '✨ '+txt+' — '+p.src+'　　　';
  }).join('');
  // 무한 루프를 위해 2배로
  ticker.textContent=text+text;
}

var _guideIdx=0;
function showGuideTip(){
  var tips=GUIDE_TIPS[lang]||GUIDE_TIPS.KO;
  var bubble=document.getElementById('guide-bubble');
  var text=document.getElementById('guide-text');
  if(!bubble||!text)return;
  text.textContent=tips[_guideIdx%tips.length];
  _guideIdx++;
  bubble.style.display='block';
  setTimeout(function(){if(bubble)bubble.style.display='none';},5000);
}

// ── 탭 전환 ──
function sv(v){
  document.querySelectorAll('.view').forEach(function(el){el.classList.remove('on');});
  document.querySelectorAll('.vtab').forEach(function(b){b.classList.remove('on');});
  document.getElementById(v+'-view').classList.add('on');
  document.querySelector('[data-v="'+v+'"]').classList.add('on');
  if(v==='map'){
    if(_mapReady&&!_map) _initMap();
    else if(_map) setTimeout(function(){naver.maps.Event.trigger(_map,'resize');},150);
  }
  if(v==='list'){ buildListFilter(); renderList(); }
  if(v==='goods') renderGoods();
  if(v==='trail') renderTrail();
  if(v==='info')  renderInfo();
}

// ── 이벤트 ──
document.querySelectorAll('.vtab').forEach(function(b){
  b.addEventListener('click',function(){sv(this.dataset.v);});
});
document.querySelectorAll('.lang-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    lang=this.dataset.lang;
    document.querySelectorAll('.lang-btn').forEach(function(b){b.classList.remove('on');});
    this.classList.add('on');
    ['goods-inner','trail-inner','info-inner'].forEach(function(id){
      var el=document.getElementById(id);
      if(el) delete el.dataset.done;
    });
    applyT();
    if(_map) _buildMapFilter();
    var cur=document.querySelector('.vtab.on');
    if(!cur) return;
    var v=cur.dataset.v;
    if(v==='goods') renderGoods();
    else if(v==='trail') renderTrail();
    else if(v==='info') renderInfo();
    else if(v==='list'){ buildListFilter(); renderList(); }
  });
});
document.getElementById('pop-x').onclick=closePopup;
document.getElementById('pop-ov').onclick=function(e){if(e.target===this)closePopup();};

// ── 시작 ──
applyT();
initCheonBanner();


function switchPopTab(btn){
  var tab=btn.getAttribute('data-tab');
  document.querySelectorAll('.pop-tab').forEach(function(b){b.classList.remove('on');});
  ['info','menu','goods'].forEach(function(id){
    var el=document.getElementById('pop-tab-'+id);
    if(el)el.style.display=id===tab?'block':'none';
  });
  btn.classList.add('on');
}
