   sub:{KO:'1629~1703 · 수락산 서계정사를 지은 실학자',EN:'1629~1703 · Pragmatist scholar who built Seogye-jeongsa on Suraksan',JP:'1629~1703 · 水落山に西渓精舍を建てた実学者',CN:'1629~1703 · 在水落山建造西溪精舍的实学者'},
   body:{KO:'박세당은 조선 후기 수락산을 이야기할 때 절대 빠질 수 없는 인물이다. 지금도 수락산 자락에는 그의 흔적이 남아 있다. 바로 서계 박세당의 이름을 딴 서계종택과 서계정사 이야기다. 수락산 역사 속 인물들 가운데 실제로 가장 강하게 지역과 연결되는 인물 중 하나라고 볼 수 있다.\n\n박세당은 1629년에 태어났다. 조선 후기 대표 학자이자 정치인이었지만, 동시에 굉장히 위험한 사상가로 여겨졌던 인물이었다. 그는 당시 조선을 지배하던 성리학의 해석을 무조건 따르지 않았다. 특히 주자의 학설을 절대적인 진리처럼 받드는 분위기를 비판했다.\n\n당시 조선은 학문 자체가 권력이던 시대였다. 어떤 해석을 하느냐에 따라 목숨이 오가기도 했다. 특히 송시열 중심의 노론 세력은 매우 강력했고, 성리학 해석에서 벗어나는 사람을 위험하게 여겼다.\n\n박세당은 바로 그 정면에 섰다.\n\n그는 현실과 백성의 삶을 중요하게 생각했다. 형식적인 명분보다 실제 세상이 어떻게 돌아가는지에 관심이 많았다. 그래서 기존 학자들과 계속 충돌하게 된다.\n\n결국 그는 ‘사문난적’이라는 공격까지 받는다. 조선에서 사문난적이라는 말은 단순 비판이 아니었다. 학문의 질서를 어지럽히는 위험한 인물이라는 뜻이었다. 사실상 정치적 사형선고에 가까운 표현이었다.\n\n박세당은 점점 권력 중심에서 밀려난다. 그리고 그가 머문 곳이 바로 수락산이었다.\n\n그는 수락산 자락에 서계정사를 짓고 학문 연구와 후학 양성에 집중한다. 지금으로 보면 거대한 사설 연구소 같은 공간이었다. 하지만 단순한 공부방이 아니었다. 당시 조선 지식인 사회에서 기존 질서에 답답함을 느끼던 사람들이 그곳으로 모여들었다.\n\n수락산은 당시 한양 가까이에 있으면서도 세상과 거리를 둘 수 있는 공간이었다. 박세당은 그 산 아래에서 조용히 자신의 사상을 정리해간다.\n\n흥미로운 건 그의 학문 스타일이다. 그는 책 속 문장만 외우는 학문을 싫어했다. 실제 백성의 삶과 현실 정치, 농업과 경제 문제까지 관심을 가졌다. 그래서 그의 글에는 현실감이 강하다.\n\n그는 특히 농업과 생활 문제에도 관심이 많았는데, 이런 점 때문에 일부 학자들은 박세당을 굉장히 실용적인 학자로 평가한다. 단순히 명분만 따지는 사람이 아니었던 것이다.\n\n하지만 조선은 새로운 생각을 쉽게 받아들이지 않는 사회였다. 결국 박세당은 계속 공격받는다.\n\n그런데도 그는 수락산을 떠나지 않았다.\n\n오히려 그곳에서 더 자유롭게 자신의 생각을 펼쳤다. 젊은 선비들은 몰래 수락산 서계정사를 찾아왔다고 전해진다. 중앙 정치에선 위험인물 취급을 받았지만, 새로운 시대를 고민하던 사람들에겐 굉장히 매력적인 학자였던 것이다.\n\n박세당이 수락산과 특별하게 연결되는 이유는 지금도 흔적이 남아 있기 때문이다. 단순 전설 수준이 아니라 실제 유적과 공간이 이어진다. 그래서 수락산 역사에서 박세당은 굉장히 중요한 인물이다.\n\n또 흥미로운 건 수락산 자체 분위기와도 잘 어울린다는 점이다. 수락산은 이상하게 권력 중심에서 밀려난 사람들, 혹은 세상과 거리를 두려 했던 인물들의 이야기가 많다. 김시습이 그랬고, 인현왕후가 그랬으며, 박세당 역시 그런 흐름 안에 있다.\n\n박세당은 산속에 숨은 은둔자처럼 살았지만 동시에 굉장히 치열한 사상가였다. 그는 수락산 아래에서 조선 사회 자체를 다시 생각하고 있었다.\n\n그래서 어떤 의미에선 수락산은 단순한 자연 공간이 아니라 조선의 대안적 지식인들이 숨 쉬던 공간처럼 느껴지기도 한다.\n\n지금 수락산을 걷다 보면 평범한 등산로처럼 보이지만, 조선 후기에는 그곳 어딘가에서 기존 질서와 싸우던 한 학자가 새로운 세상을 고민하고 있었던 셈이다.',
         EN:'Park Se-dang is absolutely inseparable from any discussion of Suraksan in the late Joseon period. His traces remain at the foot of the mountain today — the Seogye ancestral home and Seogye-jeongsa study hall.\n\nBorn in 1629, he was a leading scholar of late Joseon but regarded as dangerously unconventional. He refused to blindly follow dominant Neo-Confucian interpretations, especially criticizing the atmosphere of treating Zhu Xi\'s doctrines as absolute truth. In an era when scholarship was power, this was extraordinarily risky.\n\nEventually attacked as a \'heretic to Confucian learning\' — practically a political death sentence — he was pushed from the centers of power and settled at Suraksan. There he built Seogye-jeongsa and devoted himself to scholarship. Intellectuals suffocated by the existing order gathered there.\n\nHe despised learning that merely memorized texts, caring about real people\'s lives, governance, agriculture and economics. Young scholars visited Seogye-jeongsa in secret — he was dangerous in central politics, but deeply attractive to those pondering a new age.\n\nSuraksan in this sense was a space where Joseon\'s alternative intellectuals breathed freely.',
         JP:'朴世堂は朝鮮後期の水落山を語る際に欠かせない人物だ。今も水落山の麓には西渓宗宅と西渓精舍が残っている。\n\n1629年生まれ。性理学の解釈に無条件に従わず、「斯文乱賊」という攻撃まで受けた事実上の政治的死刑宣告だった。権力の中心から追われた彼が向かったのが水落山だった。\n\n山麓に西渓精舍を建て、学問研究と後進育成に専念した。既存の秩序に窒息感を感じていた知識人たちが集まり、若い儒者たちが秘かに訪ねてきたとも伝えられる。書物の暗記ではなく百姓の実生活、農業、経済に関心を持った実践的な学者だった。\n\n水落山はある意味、朝鮮のオルタナティブな知識人たちが息づいた空間だった。',
         CN:'朴世堂是谈论朝鲜后期水落山时绝对不可或缺的人物。至今水落山麓仍留有西溪宗宅与西溪精舍。\n\n生于1629年，他拒绝盲从性理学解释，被扣上「斯文乱贼」帽子，几近政治上的死刑宣判。被逐出权力中心后他来到水落山，建造西溪精舍，专心治学育人。对现有秩序感到压抑的知识分子们聚集于此，年轻士人们也悄悄前来拜访。\n\n他厌恶只背诵文章的学问，关注百姓生活、农业与经济。水落山某种意义上是朝鲜另类知识分子自由呼吸的空间。'}},

   sub:{KO:'1363~1452 · 세종의 명재상, 수락산 계곡에서 쉬어간 정승',EN:'1363~1452 · Sejong\'s great minister who rested at Suraksan valley',JP:'1363~1452 · 世宗の名宰相、水落山渓谷で休んだ政丞',CN:'1363~1452 · 世宗名相，在水落山溪谷休憩的政丞'},
   body:{KO:'황희는 조선 초기 최고의 재상으로 기억되는 인물이다. 사람들은 흔히 “청백리”, “현명한 정승”, “모든 말을 다 들어준 재판 이야기” 같은 일화로 기억한다. 하지만 실제 황희라는 인물은 단순히 온화한 재상이 아니라, 고려 말과 조선 건국이라는 가장 혼란한 시대를 살아남은 굉장히 현실적인 정치가였다. 그리고 그의 삶 역시 수락산과 연결되는 이야기 속에 남아 있다.\n\n황희는 1363년에 태어났다. 고려 말의 혼란, 왜구의 침략, 권문세족의 부패, 그리고 조선 건국까지 모두 직접 경험한 세대였다.\n\n젊은 시절 그는 고려 관리였다. 하지만 시대는 빠르게 무너지고 있었다. 결국 이성계 세력이 새로운 나라 조선을 세우게 되고, 황희 역시 새 왕조 안에서 살아남아야 했다.\n\n흥미로운 건 황희가 단순히 권력에 붙어 살아남은 인물이 아니라는 점이다.\n\n그는 굉장히 신중한 사람이었다. 말을 함부로 하지 않았고, 극단적으로 편을 가르지 않았다. 그래서 오히려 여러 왕 시대를 거치며 오래 살아남을 수 있었다.\n\n특히 세종 시대에 이르러 그는 조선 최고의 재상으로 자리 잡는다.\n\n세종과 황희 조합은 지금도 조선 최고의 군신 관계 가운데 하나로 평가된다.\n\n세종이 뛰어난 왕이었다면, 황희는 그 왕을 안정적으로 받쳐준 현실 감각 뛰어난 재상이었다.\n\n하지만 황희 삶에도 긴장과 피로는 많았다.\n\n조선 초기 정치판은 매우 위험했다. 왕자의 난 이후 권력 싸움의 기억이 여전히 남아 있었고, 조금만 잘못 움직여도 제거될 수 있었다.\n\n황희는 그런 시대 속에서 균형을 유지하려 애썼다.\n\n그래서 후대에는 “모든 사람 말을 들어주는 재상” 이미지가 생긴다.\n\n유명한 일화처럼 두 사람 이야기를 듣고 둘 다 맞다고 했다는 이야기도 결국은 황희 정치 스타일을 상징적으로 보여주는 것이다.\n\n그는 극단 대신 균형을 선택했다.\n\n수락산과 연결되는 이야기도 이런 분위기와 닮아 있다.\n\n조선 초기 한양 북쪽 산들은 왕실과 고위 관료들이 자주 찾던 공간이었다. 특히 수락산은 도성과 가까우면서도 상대적으로 조용하고 깊은 분위기를 가진 산이었다.\n\n후대 지역 이야기에서는 황희가 수락산 일대에 머물며 마음을 정리했다는 전승들이 이어진다.\n\n정확한 공식 기록만으로 모두 단정되진 않지만, 중요한 건 당시 조선 선비와 대신들에게 수락산이 사색과 휴식의 공간으로 인식되었다는 점이다.\n\n황희 같은 인물에게도 그런 공간은 필요했을 것이다.\n\n그는 평생 사람 사이에서 균형을 맞추며 살아야 했다.\n\n왕과 신하 사이.\n개혁과 안정 사이.\n강경파와 온건파 사이.\n\n항상 중심을 잡아야 했던 사람이다.\n\n그래서 수락산 같은 조용한 산은 정치 피로를 잠시 내려놓을 수 있는 장소처럼 느껴졌을 가능성이 크다.\n\n흥미로운 건 황희 이미지 자체도 수락산과 잘 어울린다는 점이다.\n\n수락산은 북한산처럼 압도적 권위의 느낌보다, 조용하지만 단단한 분위기가 있다.\n\n겉으로 화려하진 않지만 오래 바라볼수록 깊이가 느껴지는 산이다.\n\n황희 역시 그런 타입이었다.\n\n강한 무장도 아니고, 화려한 혁명가도 아니었다. 대신 오랜 시간 조선을 안정시킨 무게감 있는 인물이었다.\n\n또 수락산은 이상하게 극단적인 인물들만 남은 산이 아니다.\n\n김시습 같은 방랑 천재도 있지만, 황희처럼 현실 속 균형을 지키려 했던 사람 이야기도 함께 남아 있다.\n\n그래서 수락산은 조선의 다양한 인간 군상을 품고 있는 산처럼 느껴지기도 한다.\n\n지금도 수락산을 걸으면 묘하게 마음이 차분해지는 구간들이 있다.\n\n아마 황희 같은 인물도 그런 고요함 속에서 잠시 정치의 무게를 내려놓으려 했을지 모른다.\n\n그리고 그래서 수락산은 지금까지도 단순한 자연 풍경 이상의 역사적 분위기를 가진 산으로 기억되는 것이다.',
         EN:'Hwang Hui is remembered as the greatest minister of early Joseon — the incorruptible official, the wise statesman of familiar anecdotes. But the real Hwang Hui was an extraordinarily practical politician who survived the most tumultuous era from Goryeo\'s fall to Joseon\'s founding.\n\nThe pairing of King Sejong and Hwang Hui is still regarded as Joseon\'s finest ruler-minister relationship. Sejong was remarkable but exhausting to work alongside — working from before dawn until night, summoning ministers constantly. Even in advanced age, Hwang Hui processed enormous workloads.\n\nFrom this comes a charming story: utterly exhausted, Hwang Hui slipped away from Hanyang and climbed Suraksan to rest. \'Even Joseon\'s greatest minister was so tired he fled to Suraksan to catch his breath.\'\n\nEntering the valley, one hears water constantly and the forest deepens. The very name Suraksan — \'water-falling mountain\' — comes from water cascading between rocks. Local tradition says Hwang Hui loved the sound of Suraksan\'s valley water. His story here feels far more human than any tale of grand politics.',
         JP:'黄喜は朝鮮初期最高の宰相として記憶される人物だ。しかし実際は高麗末と朝鮮建国という混乱の時代を生き延びた非常に現実的な政治家だった。\n\n世宗と黄喜のコンビは朝鮮最高の君臣関係の一つとして評価される。世宗は夜明けから深夜まで働き臣下を絶え間なく呼び出した。高齢になっても黄喜は膨大な業務をこなし続けた。\n\nそこから面白い話が伝わる。黄喜があまりに疲れて水落山へ休みに行ったという話だ。「朝鮮最高の宰相も疲れ果てて水落山へ息抜きに行った。」水落山の渓谷に入ると水の音が絶えず聞こえ、地域の伝承では黄喜も水落山の渓谷の水音を好んだという。彼の水落山の話は政治の話よりずっと人間的だ。',
         CN:'黄喜是朝鲜初期最伟大的宰相，以清廉正直著称。但真实的他是在高丽末年到朝鲜建国动荡时代中生存下来的极务实的政治家。\n\n世宗与黄喜的组合被视为朝鲜最佳君臣关系之一。世宗从黎明工作到深夜，即便年迈，黄喜仍要处理海量政务。\n\n由此流传下一个故事：黄喜太过疲惫，悄悄离开汉阳，上水落山休息。「连朝鲜最伟大的宰相也累得逃到水落山喘口气。」走入溪谷，水声不绝于耳，据说黄喜也喜爱水落山溪谷的水声。他在这座山的故事，比任何政治叙事都更显人情味。'}},

   sub:{KO:'1335~1408 · 조선을 세운 태조, 수락산의 북방 기운',EN:'1335~1408 · Taejo who founded Joseon, the northern spirit of Suraksan',JP:'1335~1408 · 朝鮮を建てた太祖、水落山の北方の気',CN:'1335~1408 · 建立朝鲜的太祖，水落山的北方之气'},
   body:{KO:'이성계는 조선을 세운 태조로 기억되지만, 그의 삶을 자세히 들여다보면 끊임없이 불안과 피로 속에 살아간 인물이었다. 그리고 수락산과 연결되는 이야기 역시 단순한 등산이나 유람이 아니라, 왕권과 인간적인 고독이 함께 섞인 분위기로 전해진다.\n\n이성계는 원래 함경도 지역 무장이었다. 고려 말 왜구와 홍건적을 막아내며 이름을 알렸고, 압도적인 군사 능력으로 점점 권력을 얻게 된다.\n\n특히 위화도 회군은 조선 역사 전체를 뒤집은 사건이었다.\n\n요동 정벌을 위해 출정했던 이성계는 압록강 근처 위화도에서 결국 군대를 돌린다. 그리고 고려 왕조를 무너뜨리고 새로운 나라 조선을 세우게 된다.\n\n하지만 흥미로운 건, 그렇게 강력한 권력을 손에 넣은 이후에도 이성계 삶은 결코 편하지 않았다는 점이다.\n\n왕자의 난 때문이다.\n\n특히 자신의 아들 이방원, 훗날 태종과의 갈등은 치명적이었다.\n\n정도전을 중심으로 한 신진 세력과 왕자들의 권력 충돌 속에서 결국 피바람이 불었다. 이방원은 형제들을 제거했고, 이성계는 엄청난 충격을 받는다.\n\n결국 그는 왕 자리에서 물러난다.\n\n조선을 세운 왕이지만, 정작 말년에는 정치와 권력에 깊은 상처를 입은 사람이 되어버린 것이다.\n\n수락산과 연결되는 이야기는 바로 이런 말년 분위기와 이어진다.\n\n한양 북쪽 산들은 조선 초기 왕실과 밀접한 공간이었다. 도성과 가까우면서도 조용했고, 왕이나 왕족들이 머리를 식히기 좋은 장소였다.\n\n그 가운데 수락산은 특히 깊은 바위산의 분위기가 강했다.\n\n후대 지역 전승에서는 이성계가 수락산 일대를 찾았다는 이야기가 남아 있다. 특히 조선을 세운 뒤에도 끊임없이 이어지는 정치 갈등 속에서 북쪽 산을 자주 바라봤다는 식의 이야기들이 전해진다.\n\n정확한 공식 기록으로 모두 확인되는 것은 아니지만, 중요한 건 당시 사람들에게 수락산이 단순한 산이 아니라 왕조와 연결된 북방의 상징처럼 인식되었다는 점이다.\n\n생각해보면 수락산 풍경은 이성계 이미지와도 잘 어울린다.\n\n험한 바위산.\n강한 능선.\n북방 기운이 느껴지는 산세.\n\n실제로 이성계는 남쪽의 화려한 문신형 군주보다는 북방 무장에 가까운 인물이었다.\n\n그래서 수락산 같은 산은 굉장히 잘 어울리는 공간처럼 느껴진다.\n\n특히 수락산은 한양 바로 옆에 있으면서도 묘하게 거칠고 야성적인 분위기가 남아 있다. 조선 초기 개국기의 긴장감과도 닮아 있다.\n\n이성계는 조선을 세웠지만, 동시에 고려를 무너뜨린 사람이기도 했다.\n\n그래서 그의 삶에는 늘 양면성이 따라다닌다.\n\n영웅인가, 반역자인가.\n새 시대의 창조자인가, 옛 나라의 파괴자인가.\n\n그 복잡한 감정이 그의 말년에도 계속 남아 있었다.\n\n후대 기록들을 보면 이성계는 점점 정치에서 멀어질수록 불교와 자연 가까이 머물려는 모습도 보인다.\n\n흥미롭게도 수락산 역시 오래전부터 암자와 불교 문화가 이어진 산이었다.\n\n그래서 어떤 의미에서는 수락산 자체가 이성계 말년의 분위기와 묘하게 닮아 있다.\n\n강한 권력의 냄새와 동시에 깊은 허무함이 함께 남아 있는 공간.\n\n수락산이 단순한 명산 이상의 분위기를 가지는 이유도 바로 이런 역사적 기억들이 겹쳐 있기 때문이다.',
         EN:'Yi Seonggye is remembered as the founding king of Joseon, but a closer look reveals a man who lived in constant anxiety and exhaustion.\n\nOriginally a military commander from Hamgyeong province, he gained power through overwhelming martial ability — famous for battles against Japanese pirates and the Red Turbans. The pivotal moment was the Wihwado Retreat: sent to conquer Liaodong, he turned his army back, toppled Goryeo, and founded Joseon.\n\nYet even after seizing such power, his life was never peaceful. The strife of princes — especially the conflict with his son Yi Bang-won, later King Taejong — was devastating. He eventually abdicated.\n\nThe connection to Suraksan flows from this late-life atmosphere. The mountain\'s rugged rock faces, strong ridgelines, and northern spirit suit his image well.\n\nThe mountain seems to hold his complicated legacy: outwardly hard and strong, but inwardly lonely and exhausted. A man who founded Joseon but also destroyed Goryeo. Hero or traitor? That unresolved feeling lingers with Suraksan.',
         JP:'李成桂は朝鮮を建てた太祖として記憶されるが、その生涯は絶えず不安と疲労の中にあった。\n\n元は咸鏡道の武将で、倭寇や紅巾族との戦いで名を上げた。威化島回軍で高麗を倒し朝鮮を建国したが、王子の乱、特に息子の李芳遠との葛藤は致命的で、結局退位する。\n\n水落山との繋がりはこの晩年の雰囲気と結びついている。険しい岩山、強い尾根、北方の気配は李成桂のイメージと重なる。外は硬く強そうに見えるが、内には孤独と疲れが潜む山。朝鮮を建てたが高麗を滅ぼした人。英雄か反逆者か。その複雑な感情が水落山とともに残っている。',
         CN:'李成桂被铭记为建立朝鲜的太祖，但细看其生平，他是在不断的不安与疲惫中度过一生的人。\n\n原本是咸镜道武将，在抗击倭寇和红巾军的战斗中声名大噪。威化岛回军推翻高丽，建立朝鲜。然而王子之乱，尤其是与儿子李芳远的冲突是致命的，最终退位。\n\n与水落山的联系正来自这段晚年的氛围。险峻岩山、强劲山脊、北方气息，与李成桂的形象颇为相符。表面坚硬强大，内里潜藏着孤独与疲惫。建立朝鲜，同时也毁灭了高丽。英雄还是叛逆者？那复杂的情感与水落山一同留存。'}},

   nm:{KO:'이황',EN:'Yi Hwang',JP:'李滉',CN:'李滉'},
   sub:{KO:'1501~1570 · 퇴계 이황, 수락산에서 사색한 성리학자',EN:'1501~1570 · Toegye Yi Hwang, Neo-Confucian scholar who contemplated at Suraksan',JP:'1501~1570 · 退渓李滉、水落山で思索した性理学者',CN:'1501~1570 · 退溪李滉，在水落山沉思的性理学者'},
   body:{KO:'이황은 조선 역사에서 가장 위대한 성리학자 가운데 한 사람으로 평가받는다. 흔히 퇴계 이황이라는 이름으로 더 유명하다. 하지만 많은 사람들이 생각하는 것처럼 단순히 책만 읽던 학자는 아니었다. 그는 굉장히 예민하고 고독한 사람이었고, 자연 속에서 사색하는 것을 무엇보다 중요하게 여겼다. 그리고 그런 분위기는 수락산 이야기와도 묘하게 이어진다.\n\n이황은 1501년에 태어났다. 조선 중종 시대 사람이었으며, 평생 학문과 정치 사이에서 끊임없이 고민했다. 당시 조선은 성리학이 국가 질서의 중심이던 시대였다. 학문은 단순 공부가 아니라 정치와 권력 자체였다.\n\n이황은 어려서부터 천재로 유명했다. 하지만 그는 권력욕이 강한 사람이 아니었다. 오히려 벼슬보다 학문과 수양을 더 중요하게 생각했다.\n\n그래서 그는 관직에 나갔다가도 자주 내려오기를 반복했다.\n\n몸이 약하기도 했고, 무엇보다 혼탁한 정치판 자체를 굉장히 피로하게 느꼈다.\n\n이황은 특히 자연 속에서 마음을 다스리는 걸 중요하게 생각했다. 산과 계곡, 조용한 정자와 독서를 사랑했다. 유명한 도산서원 역시 그런 철학의 연장선이었다.\n\n수락산과 연결되는 이야기도 바로 이런 분위기 속에서 나온다.\n\n조선 시대 문인들에게 수락산은 굉장히 독특한 산이었다. 한양 가까이에 있으면서도 깊은 산중 분위기를 가지고 있었고, 기암괴석과 계곡 풍경이 아름다웠다.\n\n특히 성리학자들은 자연을 단순 풍경으로 보지 않았다.\n\n산을 바라보며 마음을 수양하고, 자연 질서 속에서 인간의 도리를 생각하려 했다.\n\n이황 같은 인물에게 수락산은 단순한 유람지가 아니라 사색의 공간처럼 느껴졌을 가능성이 크다.\n\n후대 전승에서는 이황이 수락산을 찾았다는 이야기들이 남아 있다. 정확한 공식 기록은 제한적이지만, 조선 선비 문화 안에서 수락산은 이미 유명한 산이었다.\n\n특히 바위가 많고 물소리가 깊은 산세는 많은 문인들에게 강한 인상을 남겼다.\n\n흥미로운 건 이황의 철학 자체가 수락산 분위기와 굉장히 잘 어울린다는 점이다.\n\n수락산은 화려하거나 압도적인 산이라기보다 조용히 사람을 끌어당기는 산에 가깝다.\n\n겉으로는 단단한 바위산이지만 안으로 들어가면 계곡과 숲길이 이어지고, 생각보다 깊은 고요함이 있다.\n\n이황 역시 비슷했다.\n\n겉으로는 엄격한 유학자였지만, 실제론 굉장히 섬세하고 사색적인 인물이었다.\n\n그는 인간의 마음과 감정을 매우 중요하게 봤다. 특히 “마음이 어떻게 움직이는가”에 대해 평생 고민했다.\n\n그래서 그의 글을 읽다 보면 단순 교과서 같은 느낌보다, 오히려 굉장히 내면적인 철학자처럼 느껴질 때가 많다.\n\n이황은 자연 속에서 그런 고민을 정리하곤 했다.\n\n바람 소리, 물 흐르는 소리, 산 그림자를 바라보며 인간과 세상의 이치를 생각했다.\n\n수락산 같은 산은 바로 그런 조선 선비 문화와 잘 맞아떨어지는 공간이었다.\n\n또 흥미로운 건 수락산이 단순 무인이나 은둔자 이야기만 남은 산이 아니라는 점이다.\n\n김시습 같은 방랑 천재, 박세당 같은 비판적 학자, 천상병 같은 시인뿐 아니라 이황 같은 정통 성리학자 이야기까지 함께 남아 있다.\n\n그만큼 수락산은 다양한 시대 사람들의 정신적 공간 역할을 했던 셈이다.\n\n지금 수락산을 오르면 서울 도시 풍경이 한눈에 보인다. 하지만 조금만 숲 안으로 들어가면 의외로 조용하다.\n\n아마 조선 시대 선비들도 비슷한 감정을 느꼈을 것이다.\n\n도성은 가까이 있지만, 마음은 잠시 세상 밖으로 빠져나오는 느낌.\n\n이황 역시 그런 공간 속에서 잠시 정치와 세속을 잊고 자연과 자신의 마음을 바라보려 했던 인물로 기억된다.',
         EN:'Yi Hwang — Toegye — is regarded as one of the greatest Neo-Confucian scholars in Joseon history. But he was not simply buried in books. He was acutely sensitive and solitary, and considered contemplation in nature paramount. That atmosphere connects strangely to Suraksan.\n\nBorn in 1501, he spent his life in constant tension between scholarship and politics, repeatedly entering and resigning from official positions. His body was weak, and he found the murky political world genuinely exhausting.\n\nHe believed deeply in calming the mind through nature — loving mountains, valleys, quiet pavilions, and reading. The famous Dosan Seowon was an extension of this philosophy. Neo-Confucian scholars did not regard nature as mere scenery; they contemplated mountains to cultivate the mind. For someone like Yi Hwang, Suraksan was not a sightseeing destination but a space for deep thought.\n\nSuraksan draws people quietly rather than overwhelming them. Hard rocky surface, yet inside — valleys, forest paths, deeper silence than expected. Yi Hwang was similar: outwardly a strict Confucian, but actually deeply sensitive and contemplative.',
         JP:'李滉は朝鮮歴史で最も偉大な性理学者の一人として評価される。しかし単に書物を読んでいた学者ではなく、非常に繊細で孤独な人物だった。そのような雰囲気は水落山の話とも不思議につながっている。\n\n1501年生まれ。生涯、学問と政治の間で葛藤し、官職に就いては退くことを繰り返した。体も弱く、混濁した政治の世界を疲れるものと感じていた。自然の中で心を整えることを大切にし、陶山書院もそのような哲学の延長にある。\n\n性理学者たちは山を眺めながら心を修養し、自然の秩序の中で人間の道理を考えた。李滉にとって水落山は単なる遊覧地ではなく思索の空間だった。水落山は静かに人を引き寄せる山で、外は硬い岩山だが中に入れば深い静寂がある。李滉もそれに似ていた。',
         CN:'李滉是朝鲜历史上最伟大的性理学者之一，更广为人知的名号是退溪。但他并非只会读书的学者，而是极为敏感、孤独的人，将在自然中沉思视为最重要的事。\n\n1501年生，一生在学问与政治之间挣扎，反复入仕又辞官，体弱多病，对污浊政治深感疲倦。他特别重视在自然中调养身心，陶山书院正是这种哲学的延伸。\n\n性理学者凝望山岳以修养心性，在自然秩序中思考人伦之道。对李滉而言，水落山不是游览之地，而是沉思之所。水落山静静吸引人而非压倒人——表面坚硬，走入其中却有意想不到的深邃静谧。李滉亦如此。'}},

   sub:{KO:'1476~1506 · 수락산 백성을 내쫓은 폭군',EN:'1476~1506 · The tyrant who expelled the people of Suraksan',JP:'1476~1506 · 水落山の民を追い出した暴君',CN:'1476~1506 · 将水落山百姓驱逐的暴君'},
   body:{KO:'연산군은 조선 역사에서 가장 악명 높은 왕으로 기억된다. 사람들은 흔히 그를 폭군이라고 부른다. 실제로도 그는 수많은 사람을 죽이고 나라 전체를 공포로 몰아넣었다. 하지만 연산군이라는 인물을 단순히 미친 폭군 하나로만 보면 당시 시대 분위기와 인간적인 비극이 잘 보이지 않는다. 그리고 수락산과 연결되는 이야기를 보면, 연산군이 왜 백성들에게 그렇게 증오받았는지도 조금 더 현실적으로 느껴진다.\n\n연산군은 성종의 아들로 태어났다. 하지만 그의 삶은 처음부터 불안했다. 그의 어머니 윤씨는 왕비였지만 궁중 권력 싸움 속에서 폐위되었고 결국 사약을 받고 죽게 된다. 어린 연산군은 한동안 진실을 모르고 자랐지만, 훗날 어머니의 죽음을 알게 되면서 큰 충격을 받는다.\n\n그 이후 연산군은 점점 폭력적이고 불안정한 성격으로 변해간다. 특히 자신의 어머니 죽음에 관련된 대신들과 사림 세력을 극도로 증오하게 된다. 결국 갑자사화가 벌어지고 수많은 선비들이 죽거나 유배된다. 조선 전체가 공포에 휩싸였다.\n\n하지만 연산군의 폭정은 정치에서만 끝나지 않았다.\n\n그는 유흥과 사냥에도 지나치게 집착했다. 궁궐 안에서 연회를 벌이고 기생과 악공들을 가까이 두었으며, 도성 밖으로 나가 사냥과 유람을 즐기는 일도 많았다.\n\n바로 여기서 수락산 이야기가 등장한다.\n\n당시 수락산은 지금처럼 단순한 등산 명소가 아니었다. 산 아래에는 실제 백성들이 살아가고 있었고, 나무를 하고 물을 길으며 생계를 이어가는 생활 공간이었다. 동시에 짐승이 많고 산세가 험해 왕족과 양반들의 사냥터로도 이용되던 곳이었다.\n\n지역 전승에 따르면 연산군은 수락산 일대에서 사냥을 벌였고, 그 과정에서 백성들이 큰 고통을 겪었다고 전해진다.\n\n왕이 사냥에 나서면 주변 지역은 완전히 통제되었다. 사람들은 길을 비켜야 했고, 사냥감이 도망간다는 이유로 산에 오르거나 이동하는 것조차 제한되었다. 심지어 일부 주민들은 거처에서 쫓겨나듯 피해야 했다는 이야기도 남아 있다.\n\n특히 연산군은 성격이 거칠고 자기 뜻대로 움직이는 왕이었기 때문에, 백성들의 불편이나 고통을 크게 신경 쓰지 않았다고 전해진다.\n\n수락산 지역에 연산군 이야기가 유독 부정적으로 남은 이유도 바로 여기에 있다.\n\n그는 단순히 산을 찾은 왕이 아니라, 백성들의 삶을 짓밟으며 사냥과 유흥을 즐긴 왕으로 기억된 것이다.\n\n그래서 후대 지역 전승에는 굉장히 인상적인 이야기가 하나 남아 있다.\n\n연산군이 폐위되고 죽었다는 소식이 전해지자, 수락산 아래 백성들이 기뻐하며 만세를 불렀다는 이야기다.\n\n물론 이것이 공식 사료에 정확히 기록된 것은 아니다. 하지만 이런 전승이 오랫동안 이어졌다는 사실 자체가 중요하다. 그만큼 백성들이 연산군 시대를 고통스럽게 기억했다는 의미이기 때문이다.\n\n흥미로운 건 수락산에 남은 다른 인물들의 분위기와도 비교된다는 점이다.\n\n김시습은 세상을 버리고 산으로 들어왔고, 천상병은 조용히 자연을 사랑하며 살았으며, 인현왕후는 권력에서 밀려난 슬픔과 함께 기억된다.\n\n하지만 연산군은 다르다.\n\n그는 수락산에 상처를 남긴 권력자의 이미지로 기억된다.\n\n그래서 수락산은 단순히 아름다운 자연의 산이 아니라, 조선 시대 권력과 인간의 욕망, 그리고 백성들의 고통까지 함께 남아 있는 산처럼 느껴지기도 한다.\n\n그리고 연산군은 그 이야기 속에서 가장 어둡고 거친 이름 가운데 하나로 지금까지 남아 있다.',
         EN:'Yeonsangun is remembered as Joseon\'s most notorious king. But seeing him only as a crazed tyrant misses the human tragedy and historical context. And looking at the stories connected to Suraksan shows why the people hated him so deeply.\n\nHis mother Queen Yun was dethroned and forced to drink poison. Young Yeonsangun grew up not knowing the truth; when he learned of her death, the shock was devastating. The Gapsasahwa purge followed — countless scholars executed or exiled.\n\nBut his tyranny extended beyond politics. He was obsessively attached to entertainment and hunting — this is where the Suraksan story appears. Below Suraksan, real people lived their lives. Local tradition holds that Yeonsangun held hunts in the area, and the people suffered greatly. When the king hunted, entire regions were locked down. Some residents were reportedly forced from their homes.\n\nOne striking story: when news came that Yeonsangun had been dethroned and died, the people below Suraksan cheered in celebration. His story at Suraksan is not merely a tyrant\'s record — it holds the pain and memory of ordinary people who lived beneath the mountain.',
         JP:'燕山君は朝鮮歴史で最も悪名高い王として記憶される。単に狂った暴君と見るだけでは人間的悲劇が見えてこない。\n\n母の尹氏は廃位され毒を飲まされて死んだ。真実を知らずに育った燕山君は後に母の死を知り大きな衝撃を受ける。甲子士禍が起き、多くの儒者が処刑された。\n\n暴政は政治だけにとどまらなかった。遊興と狩猟への執着が水落山の話につながる。地域の伝承によれば燕山君が水落山一帯で狩りを行い住民が苦しんだという。燕山君が廃位・死去の報が伝わると水落山麓の百姓が歓声を上げたという話まで残っている。\n\n彼の水落山の話は単なる暴君の記録ではなく、山の麓に暮らした平凡な人々の苦しみと記憶を宿している。',
         CN:'燕山君是朝鲜历史上最臭名昭著的王。若只将他视为疯狂暴君，便看不清人的悲剧。\n\n他的母亲尹氏被废位，被迫饮毒而死。燕山君后来得知真相，深受冲击。甲子士祸爆发，无数士人被处死或流放。\n\n暴政不止于政治，他对游乐和狩猎极度痴迷，引出水落山的故事。地方传说记载他在此行猎，百姓深受其苦，甚至有居民被迫逃离家园。\n\n燕山君被废、死亡的消息传来时，水落山脚下的百姓欢呼庆贺。他在水落山的故事，不只是暴君的记录，更承载着山脚下普通百姓的苦难与记忆。'}},

   sub:{KO:'1820~1898 · 수락산 내원암에서 왕기를 빈 야망가',EN:'1820~1898 · Ambitious man who prayed for royal fortune at Naewon-am',JP:'1820~1898 · 内院庵で王気を祈った野心家',CN:'1820~1898 · 在内院庵祈求王气的野心家'},
   body:{KO:'흥선대원군 이하응은 조선 후기 가장 강렬한 권력자 가운데 한 사람이다. 사람들은 흔히 고종의 아버지, 경복궁 중건을 한 인물, 쇄국정책의 상징 정도로 기억하지만 실제 그의 삶은 굉장히 처절했다. 그리고 수락산은 바로 그 “권력을 얻기 전 이하응”의 이야기가 강하게 남아 있는 장소다.\n\n원래 이하응은 몰락한 왕족에 가까운 인물이었다.\n\n왕실 혈통이긴 했지만 권력과는 거리가 멀었고 생활도 넉넉하지 못했다. 심지어 젊은 시절에는 일부러 더 망나니처럼 행동하며 세상 눈을 피했다는 이야기도 전해진다.\n\n왜냐하면 당시 조선 왕실 내부 권력 싸움이 너무 위험했기 때문이다.\n\n조금이라도 왕권과 연결 가능성이 보이면 제거될 수 있는 시대였다.\n\n그래서 이하응은 일부러 사람들 앞에서 술 마시고 방탕한 척하며 자신을 숨겼다는 이야기가 많다.\n\n하지만 속으로는 굉장히 강한 야망을 품고 있었다.\n\n그리고 바로 그 시기, 수락산 내원암과 연결된 이야기가 등장한다.\n\n지역 전승과 향토 기록들에 따르면 이하응은 왕기를 얻기 위해 수락산 내원암을 자주 찾았다고 전해진다.\n\n당시 내원암은 단순 산속 암자가 아니었다.\n\n김시습이 은거했던 장소로도 유명했고, 한양 북부에서 영험한 기운이 흐르는 곳으로 여겨졌다. 특히 수락산은 바위산 특유의 강한 산세 때문에 예로부터 풍수와 기운 이야기가 많이 따라붙던 산이었다.\n\n이하응은 풍수와 도참에 굉장히 관심이 많았던 인물로 유명하다.\n\n좋은 묏자리와 왕기가 흐르는 장소 이야기를 매우 중요하게 여겼고, 실제로 전국 명당을 찾아다녔다는 기록과 전승도 많다.\n\n수락산 내원암 역시 그런 장소 가운데 하나였다.\n\n후대 이야기에서는 이하응이 내원암에서 기도를 올리고 승려들과 왕기 이야기를 나누었다는 전승이 남아 있다.\n\n특히 아들 명복, 즉 훗날 고종이 왕이 되기를 바라는 마음으로 자주 산을 찾았다고 전해진다.\n\n생각해보면 굉장히 극적인 장면이다.\n\n아직 아무 권력도 없는 몰락 왕족.\n\n하지만 속으로는 왕실 중심으로 다시 올라가려는 엄청난 야망을 품고 있는 사람.\n\n그리고 그 사람이 새벽 안개 낀 수락산 내원암에서 조용히 기도를 올리는 모습.\n\n수락산 분위기와도 굉장히 잘 어울린다.\n\n흥미로운 건 이후 이야기가 실제로 현실이 된다는 점이다.\n\n철종이 후사 없이 죽고, 이하응의 어린 아들 명복이 왕으로 선택된다.\n\n그가 바로 고종이다.\n\n그리고 이하응은 흥선대원군으로 조선 최고 권력을 손에 쥐게 된다.\n\n그래서 후대 사람들은 “수락산의 왕기가 통했다”는 식의 이야기를 더욱 강하게 믿게 된다.\n\n또 수락산 내원암에는 이하응과 관련된 범종과 현판 이야기도 전해진다.\n\n흥선대원군이 내원암에 범종과 현판을 남겼다는 지역 전승이 이어지는 것이다.\n\n물론 세부 내용은 전승마다 조금씩 다르지만, 중요한 건 수락산 사람들이 오랫동안 이하응과 내원암을 강하게 연결해 기억해왔다는 점이다.\n\n이건 단순 관광 설화 수준이 아니다.\n\n수락산이 조선 후기 권력과 풍수, 왕실 운명 이야기까지 품고 있었다는 의미에 가깝다.\n\n흥선대원군이라는 인물 자체도 수락산 분위기와 묘하게 닮아 있다.\n\n겉으로는 거칠고 강한 바위산 같지만, 안쪽에는 욕망과 불안, 야망이 깊게 숨어 있는 느낌.\n\n그는 조선을 다시 강하게 만들려 했지만 동시에 엄청난 피로와 갈등을 남긴 인물이기도 했다.\n\n경복궁 중건으로 백성들을 혹사했고, 쇄국정책으로 시대 변화를 막으려 했으며, 권력을 위해 매우 냉혹하게 움직이기도 했다.\n\n하지만 동시에 몰락 직전 왕실을 다시 중심으로 끌어올린 엄청난 정치 감각의 소유자이기도 했다.\n\n그래서 수락산 속 흥선대원군 이야기는 단순한 산속 기도 이야기가 아니다.\n\n한 인간의 야망, 조선 말기의 불안한 권력, 그리고 왕이 되려는 운명의 냄새까지 함께 얽혀 있는 이야기로 지금까지 남아 있는 것이다.',
         EN:'Heungseon Daewongun Yi Ha-eung was one of the most powerful figures of late Joseon. People commonly remember him as Gojong\'s father, the man who rebuilt Gyeongbokgung, the symbol of isolationist policy — but his actual life was extraordinarily desperate. And Suraksan is where the story of \'Yi Ha-eung before power\' lives most strongly.\n\nOriginally close to a fallen aristocrat, he was far from power and not well-off. In his youth he reportedly acted recklessly on purpose to conceal himself — anyone who looked like they might have royal connections could be eliminated. But inside he harbored immense ambition.\n\nLocal tradition holds that Yi Ha-eung frequently visited Naewon-am on Suraksan seeking royal fortune. The hermitage was regarded as a place of powerful spiritual energy. He was deeply interested in feng shui and prophecy, reportedly praying at Naewon-am and discussing royal destiny with monks.\n\nThen the story became reality. King Cheoljong died without an heir, and Yi Ha-eung\'s young son became King Gojong. People said afterward: \'the royal fortune of Suraksan prevailed.\' Local tradition also holds that Heungseon Daewongun left a temple bell and a plaque at Naewon-am. Suraksan holds the story of late Joseon power, feng shui, and royal fate.',
         JP:'興宣大院君李昰応は朝鮮後期最も強烈な権力者の一人だ。水落山には「権力を得る前の李昰応」の話が強く残っている。\n\n元々は没落した王族に近い人物で、若い頃はわざとだらしなく振る舞い世の目を避けていたという。しかし内心には強い野望を抱いていた。\n\n地域の伝承では、李昰応は王気を得るために内院庵をよく訪れたという。風水と図谶に深く関心を持ち、内院庵で祈りを捧げ僧侶たちと王気を語り合ったとされる。\n\n後に哲宗が後嗣なく崩じ、李昰応の息子が高宗となった。「水落山の王気が通じた」と後世の人々はより強く信じるようになった。興宣大院君が内院庵に梵鐘と扁額を残したという伝承も続いている。',
         CN:'兴宣大院君李昰应是朝鲜后期最强烈的权力者之一。水落山强烈留存着「得到权力之前的李昰应」的故事。\n\n他原本接近没落王族，年轻时故意行事放荡以避世人耳目，但内心深处怀着极大野心。\n\n地方传说记载他常到水落山内院庵祈求王气，对风水与图谶极感兴趣，据说在此祈祷并与僧侣谈论王气。\n\n此后哲宗无嗣而崩，他的儿子成为高宗，后人坚信「水落山的王气应验了」。据说兴宣大院君在内院庵留下了梵钟与匾额。水落山承载着朝鲜后期权力、风水与王室命运的故事。'}},

   sub:{KO:'1676~1759 · 겸재 정선, 수락산을 화폭에 담은 진경산수화의 대가',EN:'1676~1759 · Gyeomjae Jeong Seon, master of true-view landscape who painted Suraksan',JP:'1676~1759 · 謙斎鄭敾、水落山を画幅に収めた真景山水画の大家',CN:'1676~1759 · 谦斋郑敾，将水落山入画的真景山水画大师'},
   body:{KO:'정선, 호는 겸재. 그는 조선 후기 최고의 화가 가운데 한 사람이다. 특히 실제 조선의 산과 강을 있는 그대로 그려낸 “진경산수화”의 창시자로 유명하다. 그런데 흥미로운 건 정선이 단순히 그림 잘 그리는 화가가 아니라는 점이다. 그는 직접 산을 오르고 계곡을 걸으며 풍경 속 기운을 눈에 담던 사람이었다. 그리고 수락산은 바로 그런 겸재 정선이 강한 인상을 받았다고 전해지는 산 가운데 하나다.\n\n정선이 살던 시대 이전까지 조선 그림은 중국식 이상 풍경을 따라 그리는 경우가 많았다.\n\n실제 조선 산천보다 상상 속 중국 산수화 느낌이 더 중요했던 것이다.\n\n하지만 정선은 달랐다.\n\n그는 “왜 우리 산을 두고 남의 산을 흉내 내냐”는 생각을 가진 사람이었다.\n\n그래서 직접 조선의 명산을 돌아다니며 그림을 그리기 시작한다.\n\n금강산, 인왕산, 한강, 북한산…\n\n그리고 수락산 역시 그의 시선 안에 들어온다.\n\n당시 수락산은 지금보다 훨씬 험하고 야생적인 산이었다. 거대한 화강암 바위와 절벽, 깊은 계곡, 폭포 풍경이 굉장히 인상적이었다고 전해진다.\n\n특히 안개 낀 날 수락산 바위 풍경은 마치 먹으로 찍어낸 산수화처럼 보였다고 한다.\n\n겸재 정선 같은 화가에게는 엄청난 영감의 공간이었던 셈이다.\n\n지역 전승에서는 정선이 수락산의 암벽과 폭포 풍경을 무척 좋아했고, 여러 차례 산세를 살피며 화폭에 담았다는 이야기가 전해진다.\n\n특히 수락산 계곡 쪽의 물 흐름과 바위 절벽 표현은 겸재 특유의 거칠고 힘 있는 붓 느낌과 굉장히 잘 어울린다고 평가된다.\n\n생각해보면 정선 그림 자체가 수락산 분위기와 닮아 있다.\n\n부드럽고 몽환적인 느낌보다는 바위의 단단함과 산의 기운이 살아 있다.\n\n실제로 겸재 그림을 보면 산들이 살아 움직이는 느낌이 강하다.\n\n바위는 거칠고, 나무는 바람에 흔들리고, 물은 실제 계곡처럼 흐른다.\n\n그래서 사람들은 그의 그림을 보며 “진짜 조선 산 같다”고 감탄했다.\n\n수락산 역시 그런 산이었다.\n\n예쁘게 꾸며진 산이 아니라, 바위와 물소리가 살아 있는 진짜 산.\n\n정선은 바로 그 느낌을 좋아했던 것으로 보인다.\n\n또 흥미로운 건 수락산이 단순 풍경 좋은 산이 아니라, 조선 문인과 예술가들의 정신적 공간처럼 이어졌다는 점이다.\n\n김시습은 세상을 피해 들어왔고, 박세당은 그 아래에 정자를 짓고 살았으며, 김삿갓은 김시습 흔적을 찾아 산을 올랐다.\n\n정선은 그 풍경 자체를 그림으로 남긴 사람이다.\n\n특히 후대 사람들은 수락산 바위 능선을 보며 “겸재 그림 같다”는 표현을 자주 했다.\n\n그만큼 정선 화풍과 수락산 분위기가 잘 맞아떨어졌던 것이다.\n\n그리고 진경산수화라는 건 단순 풍경 그림이 아니었다.\n\n“조선의 산은 조선답게 그려야 한다.”\n\n그런 자부심이 담긴 그림이었다.\n\n그래서 정선이 수락산을 바라봤다는 건 단순 스케치 이상의 의미를 가진다.\n\n한양 북쪽을 지키듯 서 있는 거대한 바위산.\n\n계곡마다 물이 흐르고 안개가 감도는 산.\n\n그 조선적인 풍경 속에서 겸재는 자신만의 진짜 조선 산수화를 완성해갔던 것이다.\n\n그래서 지금도 비 온 뒤 수락산 바위를 바라보면, 마치 오래된 수묵화 한 장 속에 들어온 것 같은 느낌이 들 때가 있다.\n\n그리고 그 풍경 뒤에는 붓을 들고 산세를 바라보던 겸재 정선의 시선이 아직 어딘가 남아 있는 듯한 기분이 흐르고 있다.',
         EN:'Jeong Seon — Gyeomjae — was one of the greatest painters of late Joseon, famous as the founder of \'true-view landscape painting\' depicting actual Korean mountains and rivers. But he was not simply a painter — he climbed mountains himself, walked valleys, and absorbed the energy of landscapes through his own eyes. And Suraksan made a strong impression on Gyeomjae.\n\nBefore his era, Joseon paintings often imitated idealized Chinese landscapes. He thought: \'Why imitate foreign mountains when we have our own?\' He traveled Joseon\'s famous peaks — Geumgangsan, Inwangsan, the Han River, and Suraksan entered his gaze.\n\nAt that time Suraksan was far more rugged and wild than today. Massive granite cliffs, deep valleys, waterfall scenery were tremendously impressive. On foggy days the rocky views reportedly resembled ink paintings.\n\nLocal tradition holds that Jeong Seon loved Suraksan\'s cliff and waterfall scenery, examining its contours multiple times. His characteristically rough and powerful brushwork suited the valley water flow and rocky cliffs perfectly.\n\nTrue-view landscape painting embodied pride: \'Joseon\'s mountains must be painted as Joseon\'s.\' Even today, looking at Suraksan\'s rocks after rain, one sometimes feels transported into an old ink painting.',
         JP:'鄭敾、号は謙斎。朝鮮後期最高の画家の一人で、実際の朝鮮の山と川をありのままに描いた「真景山水画」の創始者として有名だ。彼は単に絵が上手な画家ではなく、自ら山を登り渓谷を歩き風景の気を目に宿らせた人だった。\n\n彼の時代以前は中国の理想的風景を模倣する絵が多かった。「なぜ我が山があるのに他国の山を真似るのか」と彼は考え、朝鮮の名山を直接巡り絵を描いた。金剛山、仁王山、漢江、そして水落山も彼の視線に入った。\n\n当時の水落山は今よりずっと険しく野性的で、巨大な花崗岩の岩と崖、深い渓谷、滝の風景が非常に印象的だったという。霧の日の岩の風景は墨で刷った山水画のように見えたとも。\n\n鄭敾は水落山の岩壁と滝の風景を好み、何度も山の姿を確かめながら画幅に収めたという伝承が残っている。「朝鮮の山は朝鮮らしく描かなければ」という誇りが込められた真景山水画。今も雨後の水落山の岩を眺めると、古い水墨画の中に入ったような気がすることがある。',
         CN:'郑敾，号谦斋，是朝鲜后期最伟大的画家之一，以创立「真景山水画」著称。他不只是画技精湛的画家，而是亲自登山走谷，用自己眼睛捕捉风景气韵的人。\n\n在他之前，朝鲜绘画多模仿中国理想山水。他认为「为何有自己的山，却模仿他人的山？」于是亲自走遍朝鲜名山作画，金刚山、仁王山、汉江，水落山也进入了他的视野。\n\n当时水落山比现在险峻野性得多，巨大花岗岩岩壁、深邃溪谷、瀑布景观极为壮观，雾天的岩石风景据说像用墨汁印出的山水画。\n\n地方传说记载郑敾极喜水落山的岩壁与瀑布，多次察看山势并收入画幅。「朝鲜的山要画出朝鲜的样子」——这种自豪蕴含于真景山水画中。如今雨后凝望水落山岩石，有时会感觉仿佛置身一幅古老水墨画中。'}},

   nm:{KO:'엄흥도',EN:'Eom Heung-do',JP:'嚴興道',CN:'严兴道'},
   sub:{KO:'?~? · 단종의 흔적을 품고 내원암을 찾아온 충신',EN:'?~? · Loyal subject who carried Danjong\'s relics to Naewon-am',JP:'?~? · 端宗の遺品を携え内院庵を訪れた忠臣',CN:'?~? · 携带端宗遗物前往内院庵的忠臣'},
   body:{KO:'엄흥도는 조선 역사에서 아주 큰 벼슬을 지낸 인물은 아니다. 하지만 단종의 비극을 이야기할 때 반드시 등장하는 이름 가운데 하나다. 그 이유는 단순하다. 모두가 침묵하던 시대에 끝까지 단종을 잊지 않은 사람으로 기억되기 때문이다.\n\n1455년, 수양대군은 어린 단종의 왕위를 빼앗는다. 훗날 세조가 되는 순간이었다. 조선은 완전히 뒤집혔다. 김종서와 황보인 같은 대신들이 제거되고, 단종 복위를 꿈꾸던 사육신은 처형되었다. 왕을 위해 충성을 맹세했던 사람들조차 살아남기 위해 침묵해야 했다. 세조의 권력은 강했고, 단종을 언급하는 것 자체가 위험한 시대였다.\n\n엄흥도는 바로 그 시대를 살았다. 기록은 많지 않지만 후대 전승 속에서 그는 특별한 인물로 남는다. 특히 가장 유명한 이야기는 수락산 내원암과 연결된다. 전해지는 이야기로는 엄흥도가 단종의 의복이나 유품을 품고 수락산 내원암의 김시습을 찾아갔다고 한다.\n\n당시 김시습 역시 세상을 버린 인물이었다. 세종이 직접 아꼈던 천재였지만, 단종 폐위 사건 이후 큰 충격을 받는다. 그는 책을 불태우고 머리를 깎은 뒤 전국을 떠돌며 은둔 생활을 시작한다. 그리고 한양 가까이 있으면서도 깊은 산세로 세상과 단절된 수락산 내원암에 머물게 된다.\n\n엄흥도가 왜 굳이 수락산까지 찾아갔는지는 중요하다. 당시 수락산은 단순한 산이 아니었다. 정치에서 밀려난 사람들, 세상을 피해 숨으려는 사람들이 들어가던 공간이었다. 내원암 역시 바위와 숲으로 둘러싸인 조용한 암자였다. 세조 시대의 분위기를 생각하면 단종의 흔적을 품고 그런 산속 암자까지 찾아간다는 건 결코 가벼운 행동이 아니었다.\n\n후대 사람들은 이 장면을 굉장히 상징적으로 받아들였다. 폐위된 왕의 흔적을 품은 엄흥도, 세상을 등진 천재 김시습, 그리고 수락산 내원암. 이 세 요소가 겹쳐지면서 이야기는 오랫동안 전해지게 된다.\n\n흥미로운 건 엄흥도가 거대한 영웅으로 묘사되지 않는다는 점이다. 오히려 그래서 더 현실적이다. 그는 나라를 뒤집은 인물도 아니고, 칼을 들고 싸운 장수도 아니다. 하지만 모두가 잊으려 했던 시대에 혼자 기억을 품고 살아간 사람으로 남는다.\n\n이 점 때문에 최근에는 왕과 사는 남자 같은 콘텐츠 흐름 속에서도 단종과 생육신 이야기가 다시 주목받고 있다. 조선 왕실의 비극과 인간적인 충절 이야기에 사람들이 다시 관심을 가지기 시작한 것이다. 엄흥도 역시 그런 흐름 안에서 재조명되는 인물 가운데 하나다.\n\n수락산 입장에서 보면 더욱 흥미롭다. 수락산은 단순한 자연 공간이 아니라 조선의 상처가 남은 장소처럼 느껴진다. 단종의 시대를 잊지 못한 김시습이 머물렀고, 엄흥도 같은 인물이 그를 찾아왔다는 전승까지 이어진다. 그래서 수락산은 단순한 등산의 산이 아니라, 조선의 비극과 기억이 남아 있는 산이라는 이야기가 지금까지 이어지는 것이다.',
         EN:'Eom Heung-do was not a high-ranking official in Joseon history. But he is a name that always appears when speaking of the tragedy of King Danjong — because he is remembered as the person who never forgot Danjong in an age when everyone fell silent.\n\nIn 1455, Prince Suyang seized the throne from young King Danjong. Joseon was completely overturned. Even those who had sworn loyalty fell silent to survive. Sejo\'s power was absolute; even mentioning Danjong was dangerous.\n\nThe most famous story connects to Naewon-am on Suraksan: tradition holds that Eom carried Danjong\'s clothing or relics and went to find Kim Si-seup at Naewon-am. At that time Suraksan was a space where those pushed from power entered. Given Sejo\'s era, carrying a deposed king\'s relics to such a hermitage was no light action.\n\nPosterity received this scene as deeply symbolic. The man carrying a deposed king\'s traces, the genius who had turned away from the world, and Naewon-am — these three layered together, and the story has been told ever since.\n\nEom Heung-do is not depicted as a great hero. He was not someone who overturned the country or fought with a sword. But he remains in memory as someone who, in an age when everyone tried to forget, carried that memory alone.',
         JP:'嚴興道は朝鮮歴史で大きな官職を持った人物ではない。しかし端宗の悲劇を語るとき必ず登場する名前の一つで、皆が沈黙していた時代に最後まで端宗を忘れなかった人として記憶される。\n\n1455年、首陽大君が端宗の王位を奪い、世祖の権力が確立した。端宗を口にすること自体が危険な時代に、嚴興道は端宗の衣服や遺品を携え水落山内院庵の金時習を訪ねたという伝承が残っている。\n\n当時水落山は政治から追われた人々が入り込む空間だった。廃位された王の遺品を携えて山奥の庵を訪ねるというのは、セジョの時代には非常に危険な行動だった。\n\n廃位された王の遺品を携えた嚴興道、世を背いた天才金時習、そして水落山内院庵——この三要素が重なり話は長く伝えられてきた。嚴興道は巨大な英雄として描かれない。しかし皆が忘れようとした時代に一人で記憶を抱いて生きた人として残っている。',
         CN:'严兴道在朝鲜历史上并非高官显贵。但谈及端宗悲剧时，他的名字必然出现——被铭记为在众人沉默的年代，始终没有忘记端宗的人。\n\n1455年，首阳大君夺取端宗王位，世祖权力极盛，提及端宗本身都是危险的年代。严兴道携带端宗的衣物或遗物，前往水落山内院庵寻找金时习——当时水落山是被逐出政治的人隐匿之所，这一行动绝非轻率之举。\n\n携带废位之王遗物的严兴道、背离世俗的天才金时习，以及水落山内院庵——这三个要素叠合，故事由此长久流传。\n\n严兴道并非以伟大英雄的形象出现。但他以在众人都想遗忘的年代，独自怀抱记忆而活的人，留存于后人心中。'}},

   sub:{KO:'1807~1863 · 방랑 시인, 수락산 내원암에서 김시습을 만나다',EN:'1807~1863 · Wandering poet who met Kim Si-seup\'s spirit at Naewon-am',JP:'1807~1863 · 放浪詩人、水落山内院庵で金時習に出会う',CN:'1807~1863 · 流浪诗人，在水落山内院庵遇见金时习'},
   body:{KO:'김삿갓은 조선 후기 가장 전설적인 방랑 시인이다. 사람들은 흔히 삿갓 하나 쓰고 전국을 떠돌며 풍자시를 남긴 자유로운 시인으로 기억하지만, 실제 그의 삶은 굉장히 비극적이었다. 그리고 바로 그 비극 때문에 그는 수락산과 깊게 연결된다.\n\n김삿갓의 본명은 김병연이었다. 그는 원래 양반가 자손이었다. 하지만 그의 집안은 조선 역사 속 굉장히 민감한 사건과 연결되어 있었다.\n\n바로 홍경래의 난이었다.\n\n김삿갓의 할아버지 김익순은 당시 선천부사였는데, 홍경래의 난 과정에서 항복했다는 이유로 역적 취급을 받게 된다. 조선 사회에서 역적의 후손이라는 건 평생 씻기 어려운 낙인이었다.\n\n어린 김병연은 이 사실을 모르고 성장한다.\n\n그리고 훗날 과거 시험장에서 충격적인 사건이 벌어진다.\n\n그는 시험 문제로 ‘김익순의 죄를 논하라’는 글을 받게 되고, 그 사람이 자신의 할아버지인 줄 모른 채 누구보다 강하게 비판하는 글을 써버린다.\n\n하지만 나중에 진실을 알게 된다.\n\n자신이 자신의 조상을 욕한 것이다.\n\n그 충격은 엄청났다.\n\n이후 그는 세상을 떠돌기 시작한다. 삿갓을 눌러쓰고 얼굴을 가린 채 전국을 유랑하게 된다. 그래서 사람들은 그를 “김삿갓”이라 부르게 된다.\n\n흥미로운 건 바로 여기서 수락산 이야기가 연결된다는 점이다.\n\n김삿갓은 단순한 방랑객이 아니었다. 그는 전국 명산과 절, 계곡을 돌아다니며 시를 남긴 인물이었다. 특히 세상을 버린 천재 김시습을 굉장히 존경했다고 전해진다.\n\n그리고 바로 그 김시습의 흔적이 남아 있는 곳이 수락산 내원암이었다.\n\n후대 전승에 따르면 김삿갓은 김시습의 자취를 따라 수락산 내원암을 찾아와 머물렀다고 한다.\n\n생각해보면 굉장히 상징적인 장면이다.\n\n세조의 시대에 절망해 세상을 버린 김시습.\n역적 집안의 굴레를 안고 세상을 떠돌던 김삿갓.\n\n두 사람은 시대는 달랐지만 묘하게 닮아 있었다.\n\n둘 다 세상 중심에서 밀려난 사람들이었고, 둘 다 산속에서 위안을 찾으려 했다.\n\n수락산 내원암은 그런 분위기를 가진 장소였다.\n\n당시 내원암은 단순한 작은 암자가 아니었다. 한양 가까이에 있으면서도 깊은 산중 분위기를 가진 곳이었고, 세상을 피해 들어온 선비와 승려, 떠돌이 문인들의 이야기가 많이 남아 있는 공간이었다.\n\n김삿갓 역시 그 분위기에 강하게 끌렸던 것으로 보인다.\n\n특히 그는 풍자와 해학으로 유명했지만, 실제 내면은 굉장히 외롭고 슬픈 사람이었다.\n\n그의 시를 자세히 읽어보면 웃긴 표현 뒤에 깊은 허무감이 숨어 있다.\n\n그래서 수락산 같은 산은 김삿갓 정서와 굉장히 잘 어울린다.\n\n수락산은 북한산처럼 거대한 권위의 산이라기보다, 상처 입은 사람들과 은둔자 이야기가 많이 남은 산이다.\n\n김시습이 세상을 버리고 들어왔고, 엄흥도는 단종의 흔적을 품고 그 산을 찾았으며, 박세당은 권력에서 밀려난 뒤 그 아래에서 학문을 이어갔다.\n\n김삿갓 역시 그런 흐름 속에 자연스럽게 이어진다.\n\n후대 이야기에서는 김삿갓이 내원암 주변 바위와 계곡을 바라보며 시를 읊었다는 전승도 남아 있다.\n\n특히 수락산 특유의 거친 바위 풍경은 그의 방랑 시인 이미지와 묘하게 잘 어울린다.\n\n비 오는 날 안개 낀 수락산 풍경은 지금도 어딘가 쓸쓸한 분위기가 강한데, 당시 떠돌이 시인들에게는 더욱 깊은 감정을 불러일으켰을 가능성이 크다.\n\n흥미로운 건 김삿갓이 단순히 자유로운 낭만 시인이 아니라, 평생 죄책감과 떠돌이 운명을 안고 살았다는 점이다.\n\n그래서 그는 정착하지 못했다.\n\n늘 길 위에 있었고, 늘 산과 절을 떠돌았다.\n\n수락산 역시 그런 그의 방랑 인생 속 한 장면으로 남게 된다.\n\n그리고 그래서 지금도 수락산 이야기를 하다 보면, 바람 부는 능선 어딘가에서 삿갓을 눌러쓴 시인 한 사람이 천천히 걸어 내려올 것 같은 느낌이 남아 있는 것이다.',
         EN:'Kim Satgat is the most legendary wandering poet of late Joseon. People remember him as a free spirit who roamed the country under a bamboo hat leaving satirical poetry. But his actual life was deeply tragic — and it was that tragedy that connects him deeply to Suraksan.\n\nHis real name was Kim Byeong-yeon. He came from a yangban family, but his grandfather Kim Ik-sun was branded a traitor for surrendering during the Honggyeongnae Rebellion.\n\nYoung Kim Byeong-yeon grew up not knowing this truth. At a civil service examination he received the prompt: \'Discuss the crimes of Kim Ik-sun.\' Not knowing that was his grandfather, he wrote the most scathing critique. When he later learned the truth, the shock was overwhelming.\n\nFrom that point he began wandering the land, pressing the bamboo hat low over his face.\n\nKim Satgat was said to deeply revere the genius Kim Si-seup. And the place where Kim Si-seup\'s traces remained was Naewon-am on Suraksan. Tradition holds that Kim Satgat followed Kim Si-seup\'s footsteps and stayed there.\n\nKim Si-seup, who abandoned the world in despair. Kim Satgat, who wandered the world bearing the burden of a traitor\'s lineage. The two men lived in different times but were strangely alike — both pushed from the center of the world, both seeking solace in the mountains.',
         JP:'金笠は朝鮮後期最も伝説的な放浪詩人だ。本名は金炳淵。祖父の金益淳が洪景来の乱で降伏したとして逆賊扱いを受けた。\n\n幼い金炳淵はこの事実を知らずに科挙の試験場で「金益淳の罪を論ぜよ」という課題を受け取り、祖父だと知らずに最も激しく批判する文を書いてしまう。後に真実を知り大きな衝撃を受けた以後、笠を深く被り全国を流浪し始める。\n\n金笠は天才金時習を非常に尊敬していたといい、金時習の足跡が残る水落山内院庵を訪ねて滞在したという伝承が残っている。\n\n世祖の時代に絶望して世を捨てた金時習と、逆賊家系の軛を背負い流浪した金笠。時代は違ったが不思議と似ていた——どちらも世の中心から追われ、山の中に慰めを求めた。',
         CN:'金笠是朝鲜后期最传奇的流浪诗人。本名金炳渊，祖父金益淳在洪景来之乱中投降，被扣上逆贼帽子。\n\n幼年金炳渊不知此事，在科举考场收到题目「论金益淳之罪」，不知那是自己祖父，写下最严厉的批判。后来得知真相，深受冲击，此后将斗笠压低遮住面孔，漫游全国。\n\n金笠据说极为崇敬天才金时习，追寻他的踪迹来到水落山内院庵并在此停留。\n\n在世祖时代绝望而抛弃世俗的金时习，与背负逆贼家族枷锁漫游天下的金笠——两人时代不同，却奇妙地相似，都是被逐出世界中心的人，都试图在山中寻找慰藉。'}},

   sub:{KO:'1752~1800 · 외로운 개혁군주, 수락산에서 사색한 왕',EN:'1752~1800 · The lonely reformer king who contemplated at Suraksan',JP:'1752~1800 · 孤独な改革君主、水落山で思索した王',CN:'1752~1800 · 孤独的改革君主，在水落山沉思的王'},
   body:{KO:'정조는 수락산과 연결되는 인물들 가운데 가장 흥미로운 왕 중 하나다. 왜냐하면 그는 단순히 산을 찾은 왕이 아니라, 늘 불안과 긴장 속에서 살아야 했던 군주였기 때문이다. 겉으로는 조선 최고의 개혁군주처럼 보이지만, 실제 삶은 굉장히 외롭고 위험했다.\n\n정조의 인생은 어린 시절부터 비극이었다. 그의 아버지 사도세자는 뒤주 속에서 죽었다. 조선 역사상 가장 충격적인 사건 가운데 하나였다. 어린 정조는 그 장면과 분위기를 평생 잊지 못했다.\n\n문제는 왕이 된 이후에도 끝나지 않았다는 점이다.\n\n정조 주변에는 늘 암살 위협이 있었다. 노론 벽파 세력은 사도세자의 아들이 왕이 되는 것을 끝까지 불편하게 여겼다. 실제로 정조는 독살설이 지금까지 이야기될 정도로 위험한 정치 환경 속에서 살았다.\n\n그래서 정조는 다른 왕들보다 훨씬 예민하고 고독한 사람이었다.\n\n그는 활쏘기와 무예를 좋아했고, 자주 몸을 움직였다. 공부만 하는 왕이 아니라 직접 현장을 보려 했던 왕이었다. 그리고 조선 왕들 가운데 비교적 자연과 산을 가까이한 인물이기도 했다.\n\n수락산과 연결되는 이야기도 바로 이런 배경 속에서 나온다.\n\n한양 북쪽의 산들은 당시 왕실과 양반들이 자주 찾던 공간이었다. 하지만 수락산은 북한산처럼 거대한 왕실 행차 중심 산이라기보다 조금 더 조용하고 깊은 분위기의 산이었다.\n\n정조는 특히 생각이 많을 때 산을 찾았다고 전해진다.\n\n후대 지역 전승에서는 정조가 수락산에 올라 한양을 바라보며 오래 머물렀다는 이야기가 남아 있다.\n\n생각해보면 굉장히 상징적인 장면이다.\n\n조선을 통치하는 왕이지만, 동시에 가장 외로운 자리 위에 있는 인간.\n\n겉으로는 강한 군주였지만 실제론 늘 긴장 속에서 살아야 했던 사람.\n\n수락산은 그런 정조에게 잠시 숨을 돌릴 수 있는 공간처럼 느껴졌을 가능성이 크다.\n\n정조는 원래 감수성이 굉장히 풍부한 왕이었다. 단순한 정치가가 아니라 시와 글, 철학에도 뛰어났다. 그래서 자연 풍경 속에서 생각을 정리하는 걸 좋아했다.\n\n특히 수락산처럼 기암괴석과 긴 능선이 이어지는 풍경은 정조 시대 문인들에게도 인상적인 산으로 여겨졌다.\n\n당시 수락산은 지금보다 훨씬 깊고 험했다. 밤이 되면 한양의 불빛이 멀리 희미하게만 보였고, 산 전체가 조용해졌다.\n\n정조는 그런 공간에서 정치적 압박에서 잠시 벗어나고 싶었을지도 모른다.\n\n흥미로운 건 정조라는 인물 자체가 수락산 분위기와 굉장히 닮아 있다는 점이다.\n\n겉으로는 단단하고 강해 보이지만, 안에는 외로움과 긴장이 숨어 있는 느낌.\n\n수락산 역시 서울 가까이에 있지만 묘하게 고독한 분위기가 있다.\n\n정조는 재위 기간 동안 규장각을 만들고 젊은 인재들을 키웠으며, 조선 개혁을 위해 굉장히 많은 시도를 했다. 하지만 동시에 정치적으로 늘 공격받았고 완전히 편안했던 적이 거의 없었다.\n\n그래서 후대 사람들은 정조를 단순히 강한 왕이 아니라 “외로운 개혁군주”로 기억한다.\n\n수락산 이야기가 지금까지 이어지는 이유도 그 이미지와 잘 맞기 때문이다.\n\n왕이지만 마음 둘 곳이 많지 않았던 사람.\n언제나 긴장 속에서 살아야 했던 사람.\n그리고 잠시 산 위에서만 인간으로 돌아갈 수 있었던 사람.\n\n수락산은 그런 정조의 침묵과 사색이 남아 있는 산처럼 전해진다.',
         EN:'Jeongjo is one of the most fascinating figures connected to Suraksan — not simply a king who visited the mountain, but a monarch who always had to live under anxiety and tension. Outwardly Joseon\'s greatest reformer-king, but his actual life was deeply lonely and dangerous.\n\nHis tragedy began in childhood. His father Crown Prince Sado died locked in a wooden rice chest. Young Jeongjo never forgot that scene. The trouble did not end when he became king — assassination threats surrounded him constantly. The Noron Byeokpa faction found it persistently uncomfortable that Sado\'s son had become king. Jeongjo was far more sensitive and solitary than other kings.\n\nLocal tradition holds that Jeongjo climbed Suraksan and spent long hours gazing toward Hanyang — a king who governed Joseon, yet simultaneously the loneliest person in the kingdom. Outwardly strong, but inwardly always tense.\n\nDuring his reign he established Gyujanggak, nurtured young talent, and made numerous attempts at reform. Yet he was politically attacked constantly and rarely at ease. Suraksan endures in his story because it fits that image: a king with no place to rest his heart, who could only return to being fully human for a moment on a mountaintop.',
         JP:'正祖は水落山と繋がる人物の中で最も興味深い王の一人だ。単に山を訪れた王ではなく、常に不安と緊張の中で生きなければならなかった君主だった。\n\n悲劇は幼少期から始まった。父の思悼世子は米びつの中で死んだ。幼い正祖はその場面を生涯忘れなかった。王になった後も暗殺の脅威が絶えず、老論僻派は思悼世子の息子が王になることを最後まで不快に思っていた。\n\n地域の伝承では正祖が水落山に登り漢陽を眺めながら長い時間を過ごしたという話が残っている。在位中に奎章閣を設け若い才能を育て改革に取り組んだが、政治的に常に攻撃を受けた。王だが心を置く場所がなかった人。山の上でだけ一時的に人間に戻れた人。',
         CN:'正祖是与水落山相连的人物中最耐人寻味的王之一——不只是游览此山的王，而是始终在不安与紧张中生活的君主。\n\n悲剧从幼年便已开始。他的父亲思悼世子死在木箱里，幼年正祖终生未能忘却那一幕。成为王之后，暗杀威胁始终环绕，老论僻派对思悼世子之子为王耿耿于怀。\n\n地方传说记载正祖曾登上水落山，长久凝望汉阳。在位期间他设立奎章阁，培育年轻人才，为改革做出无数尝试，然而始终遭受政治攻击，几乎从未真正安宁。王，却无处安放内心。只有在山顶那片刻，才能暂时回归为人。'}},

   body:{KO:'덕혜옹주는 대한제국의 마지막 황녀이자, 한국 근현대사의 가장 비극적인 왕족 가운데 한 사람이다. 그리고 그녀의 삶 마지막 시기는 수락산과 묘하게 겹쳐진다. 조선 왕조가 무너지고, 나라가 사라지고, 궁궐의 기억조차 희미해진 시대에 그녀는 한양 북쪽의 조용한 산자락과 연결된 인물로 남게 된다.\n\n덕혜옹주는 1912년 고종의 딸로 태어났다. 하지만 그녀가 태어났을 때 대한제국은 이미 사실상 무너진 상태였다. 1910년 한일병합 이후 조선 왕실은 더 이상 나라의 왕실이 아니라 일본 통치 아래 놓인 몰락한 황실이 되어 있었다.\n\n그럼에도 고종은 늦게 얻은 딸 덕혜옹주를 무척 아꼈다고 전해진다. 덕수궁에서 자란 어린 덕혜옹주는 총명하고 예민한 아이였다고 한다.\n\n하지만 그녀의 어린 시절은 오래가지 못했다.\n\n고종이 갑작스럽게 세상을 떠나고, 조선 왕실은 더 빠르게 해체되기 시작한다. 일본은 왕실 사람들을 철저히 통제했고, 덕혜옹주 역시 정치적 상징으로 이용된다.\n\n가장 비극적인 사건은 일본 유학이었다.\n\n어린 나이에 일본으로 보내진 덕혜옹주는 사실상 강제로 조국과 분리된다. 낯선 나라에서 생활하며 점점 정신적으로 불안정해졌고, 우울증과 신경쇠약 증세도 심해졌다고 전해진다.\n\n결국 일본 귀족과 정략결혼까지 하게 된다.\n\n하지만 결혼 생활 역시 행복하지 못했다. 딸을 잃고 정신 질환까지 악화되면서 그녀의 삶은 점점 무너져간다.\n\n흥미로운 건 많은 사람들이 덕혜옹주를 단순히 “비운의 공주”로만 기억하지만, 실제 그녀는 굉장히 강한 향수병과 상실감 속에서 살았다는 점이다.\n\n그녀는 조선을 잊지 못했다.\n\n창덕궁과 덕수궁, 한양의 풍경, 어린 시절 기억을 계속 그리워했다고 전해진다.\n\n1962년, 오랜 세월 끝에 덕혜옹주는 결국 한국으로 돌아오게 된다.\n\n그때 그녀의 나이는 이미 중년을 넘긴 상태였다.\n\n하지만 돌아온 서울은 그녀가 기억하던 도시가 아니었다.\n\n왕조는 사라졌고, 궁궐 주변은 완전히 달라져 있었다.\n\n그리고 바로 이 시기, 한양 북쪽 산자락과 연결된 여러 이야기들이 남는다.\n\n수락산과 불암산 일대는 당시에도 비교적 조용한 외곽 지역이었다. 지금처럼 거대한 도시가 아니라 오래된 마을과 산길이 이어지는 공간이었다.\n\n지역 전승에서는 덕혜옹주가 북쪽 산자락 풍경을 바라보며 산책을 했다는 이야기가 전해진다. 특히 수락산 주변의 조용한 분위기가 그녀의 말년 이미지와 겹쳐지면서 지금까지도 지역 이야기처럼 남아 있다.\n\n생각해보면 굉장히 상징적인 장면이다.\n\n대한제국의 마지막 황녀.\n나라를 잃은 왕실의 마지막 세대.\n일본에서 평생 상처를 안고 돌아온 사람.\n\n그리고 그런 사람이 서울 북쪽의 조용한 산을 바라보며 시간을 보내는 모습.\n\n덕혜옹주 이야기에서 수락산이 특별하게 느껴지는 이유는 바로 그 분위기 때문이다.\n\n수락산은 이상하게 화려한 승리의 역사보다, 상처 입은 사람들의 기억과 더 잘 어울리는 산이다.\n\n김시습은 세상을 버리고 들어왔고, 인현왕후는 권력에서 밀려난 뒤 연결되었으며, 덕혜옹주는 나라 자체를 잃은 시대의 슬픔을 안고 이 산과 겹쳐진다.\n\n그래서 수락산을 단순한 자연 공간이 아니라 “잊힌 사람들의 산”처럼 느끼는 사람들도 있다.\n\n덕혜옹주 역시 그런 흐름 속에서 기억된다.\n\n조선의 마지막 공주였지만, 실제 삶은 누구보다 외롭고 조용했던 사람.\n\n그리고 수락산은 그 마지막 시대의 쓸쓸한 공기를 지금까지도 품고 있는 산처럼 남아 있다.',
         EN:'Princess Deokye was the last imperial princess of the Korean Empire, and one of the most tragic royal figures in modern Korean history. The final period of her life strangely overlaps with Suraksan. In an era when the Joseon dynasty had collapsed, the country had disappeared, and even memories of the palace had grown faint, she came to be connected to the quiet northern mountain.\n\nBorn in 1912 as a daughter of Emperor Gojong. Though he deeply cherished his late-born daughter, after Gojong\'s sudden death Deokye was sent to Japan at a young age. Living in a foreign country, she grew increasingly mentally unstable, forced into an unwanted marriage. After losing her daughter and suffering worsening mental illness, her life gradually collapsed.\n\nIn 1962, after long decades, she finally returned to Korea. But the Seoul she returned to was not the city she remembered. The dynasty had disappeared; everything was changed.\n\nThe area around Suraksan and Buramsan was then still a relatively quiet outer district. Local stories hold that Deokye walked there, gazing at the northern mountain views.\n\nThe last imperial princess. The final generation of a lost royal house. Someone who returned bearing a lifetime of wounds. Suraksan strangely suits the memories of wounded souls more than glorious victorious histories.',
         JP:'徳恵翁主は大韓帝国の最後の皇女であり、韓国近現代史で最も悲劇的な王族の一人だ。彼女の晩年は水落山と不思議に重なる。\n\n1912年、高宗の娘として生まれたが、高宗の突然の逝去後、幼くして日本へ送られる。精神的に不安定になり、望まない結婚をし、娘を失い精神疾患も悪化する中で生涯は崩れていった。\n\n1962年、長い歳月の末に韓国へ戻る。しかし帰ってきたソウルは彼女が記憶する都市ではなかった。水落山と不岩山一帯は当時も比較的静かな外縁地域で、徳恵翁主が北の山麓の風景を眺めながら散策したという話が伝えられている。\n\n大韓帝国の最後の皇女。国を失った王室の最後の世代。日本で生涯傷を抱えて帰ってきた人。水落山は栄光の歴史よりも傷ついた人々の記憶に似合う山だ。',
         CN:'德惠翁主是大韩帝国最后的皇女，也是韩国近现代史上最悲剧的王族之一。她生命最后的时光与水落山奇妙地交叠。\n\n1912年生于高宗之女。高宗突然离世后，她年幼便被送往日本，精神日益不稳，被迫嫁给了不情愿的婚事，失去女儿，精神疾病恶化，生命逐渐崩溃。\n\n1962年，历经漫长岁月终于回到韩国。然而归来的首尔已不是她记忆中的那座城市。水落山与不岩山一带当时仍是相对安静的郊区，地方故事中流传着她漫步于北部山麓、凝望山景的故事。\n\n大韩帝国最后的皇女。失去国家的王室最后一代。带着满身伤痕从日本归来的人。水落山比辉煌的胜利历史，更适合那些受伤灵魂的记忆。'}},

   sub:{KO:'1418~1486 · 조선 최고의 명필, 수락산 물로 먹을 갈다',EN:'1418~1486 · Joseon\'s greatest calligrapher who ground ink with Suraksan water',JP:'1418~1486 · 朝鮮最高の名筆、水落山の水で墨を磨る',CN:'1418~1486 · 朝鲜最伟大的书法家，以水落山水磨墨'},
   body:{KO:'한석봉은 조선 최고의 명필로 불린 인물이다. 사람들은 흔히 “어머니와 떡 썰기 이야기”만 떠올리지만, 실제 한석봉은 조선 왕실과 대신들까지 감탄하게 만든 거대한 예술가였다. 그리고 수락산에는 지금까지도 그와 관련된 오래된 설화가 남아 있다.\n\n한석봉의 본명은 한호였다. 석봉은 그의 호였다. 그는 선조 시대 최고의 글씨로 평가받았고, 중국 사신들조차 그의 글씨를 보고 놀랐다고 전해진다.\n\n당시 조선에서 글씨는 단순한 취미가 아니었다. 글씨는 곧 사람의 정신과 품격이었고, 왕의 교지와 궁궐 현판, 국가의 중요한 문서까지 모두 최고의 서예가들이 담당했다. 그리고 그 중심에 한석봉이 있었다.\n\n특히 그의 글씨는 굉장히 힘이 강했다. 부드럽게 흘러가기보다 바위처럼 단단하고 굵은 기운이 살아 있었다. 그래서 후대 사람들은 한석봉의 필체를 보며 “산세 같다”는 표현을 쓰기도 했다.\n\n그리고 바로 이 부분에서 수락산 이야기가 이어진다.\n\n수락산은 예로부터 물이 맑고 바위가 아름다운 산으로 유명했다. 기암괴석과 깊은 계곡이 이어졌고, 안개가 끼는 날이면 마치 동양 산수화 속 풍경처럼 보였다고 전해진다. 그래서 많은 선비와 문인들이 이 산을 찾았고, 자연 속에서 마음을 다스리곤 했다.\n\n지역 설화에서는 한석봉 역시 수락산을 자주 찾았다고 전해진다. 특히 그는 수락산 계곡물을 길어 먹을 갈고 글씨를 썼다는 이야기가 오래 남아 있다.\n\n당시 선비들에게 먹을 간다는 건 단순한 준비 과정이 아니었다. 마음을 가라앉히고 정신을 집중하는 일종의 수양이었다.\n\n상상해보면 굉장히 인상적인 장면이다.\n\n안개 낀 수락산 계곡.\n바위 사이로 흐르는 맑은 물.\n그리고 한 명의 서예가가 조용히 벼루에 물을 붓고 먹을 가는 모습.\n\n후대 사람들은 수락산 물로 갈아낸 먹빛이 유난히 깊고 맑았다고 이야기했다. 그리고 한석봉의 강하고 단단한 글씨 역시 수락산 바위의 기운과 닮았다고 여겼다.\n\n실제로 수락산은 화려한 산이라기보다 단단한 바위와 깊은 계곡의 분위기가 강한 산이다. 특히 비 온 뒤 검게 젖은 바위 풍경은 마치 먹으로 그린 동양화처럼 보인다.\n\n한석봉 글씨 역시 그런 느낌을 가지고 있었다.\n\n굵고 강하지만 동시에 절제되어 있고, 묵직하면서도 맑은 힘이 살아 있었다.\n\n그래서 후대 지역 사람들은 “수락산의 기운이 한석봉 붓끝에 담겼다”는 말까지 남기게 된다.\n\n또 한석봉은 단순한 예술가가 아니었다. 그는 임진왜란이라는 거대한 혼란의 시대를 직접 겪은 인물이기도 했다. 왜란 당시에는 선조를 가까이에서 보좌하며 중요한 문서 작업에도 참여했고, 나라가 무너져가는 장면을 직접 경험했다.\n\n그래서 그의 글씨에는 단순한 아름다움만이 아니라 시대의 긴장감과 무게까지 담겨 있다는 평가도 있다.\n\n수락산은 그런 혼란 속에서도 조용히 흐르는 산이었다.\n\n전쟁과 정치가 계속되던 시대에도 계곡은 흐르고 바위는 그대로 남아 있었다. 어쩌면 한석봉 역시 수락산의 고요함 속에서 잠시 세상의 피로를 잊고 싶었던 것인지도 모른다.\n\n수락산에는 김시습 같은 은둔 천재의 이야기도 남아 있고, 박세당 같은 학자의 흔적도 있으며, 천상병 같은 시인의 삶도 이어져 있다.\n\n한석봉은 그 가운데 “예술의 혼”으로 연결되는 인물이다.\n\n그리고 지금도 수락산 계곡 물소리를 듣고 있으면, 오래전 그 맑은 물로 먹을 갈며 붓을 들던 한 명의 명필이 어딘가에 남아 있는 듯한 느낌이 조용히 흐르고 있다.',
         EN:'Han Seokbong was called the greatest calligrapher of Joseon. People typically remember only the story of his mother cutting rice cakes in the dark, but he was a towering artist who astonished the royal court and high officials alike. And Suraksan holds old legends related to him to this day.\n\nHis real name was Han Ho; Seokbong was his pen name. Regarded as the finest calligrapher of the Seonjo era, even Chinese envoys were stunned by his brushwork. In Joseon, calligraphy was not mere hobby — it was the expression of a person\'s spirit and character.\n\nLocal legend holds that Han Seokbong frequently visited Suraksan and drew water from its valley to grind his ink and write. For Joseon scholars, grinding ink was not mere preparation but a form of cultivation — calming the mind, sharpening focus.\n\nPosterity said that ink ground with Suraksan water had a particularly deep and clear color. People came to say \'the energy of Suraksan was captured in Han Seokbong\'s brushwork.\' He also directly experienced the catastrophe of the Imjin War, serving close to King Seonjo and witnessing a nation on the verge of collapse. His calligraphy is said to hold not merely beauty, but the tension and weight of an era.',
         JP:'韓石峯は朝鮮最高の名筆と呼ばれた人物だ。「母と餅切り」の話しか思い浮かべない人が多いが、実際は王室や大臣たちまで感嘆させた巨大な芸術家だった。水落山には今も彼に関連した古い説話が残っている。\n\n本名は韓濩、石峯は号だった。宣祖時代最高の書として評価され、明の使節さえ驚いたという。朝鮮で書は人の精神と品格の表現だった。\n\n地域説話では韓石峯がよく水落山を訪れ、渓谷の水を汲んで墨を磨り書を書いたという話が伝わっている。儒者にとって墨を磨るというのは心を落ち着かせる修養だった。後世の人々は「水落山の水で磨った墨の色は格別に深く澄んでいた」と語り、「水落山の気が韓石峯の筆先に宿った」という言葉を残した。\n\n韓石峯は壬辰倭乱も直接経験し、王を近くで支えながら国家の危機を目撃した。彼の書には美しさだけでなく時代の緊張と重さも込められているという評価もある。',
         CN:'韩石峯被称为朝鲜最伟大的书法家。人们通常只想到「母亲切年糕」的故事，但实际上他是连王室与大臣都叹服的伟大艺术家。至今水落山仍留有与他相关的古老传说。\n\n本名韩濩，石峯是号。被誉为宣祖时代最佳书法，连明朝使节都为之惊叹。在朝鲜，书法是人的精神与品格的表达。\n\n地方传说记载他常到水落山，汲取溪谷之水磨墨作书。对儒者而言，磨墨不只是准备，而是平静心境的修养。后人说用水落山水磨出的墨色格外深邃，留下了「水落山之气蕴于韩石峯笔端」的说法。\n\n他也亲历了壬辰倭乱，近侍宣祖，亲眼目睹国家濒临崩溃。他的书法被认为不只有美感，更承载着时代的紧张与重量。'}},

   sub:{KO:'1552~1608 · 덕흥대원군의 아들, 수락산 묘역의 왕',EN:'1552~1608 · Son of Deokheung Daewongun, king of Suraksan\'s royal tomb',JP:'1552~1608 · 徳興大院君の息子、水落山墓域の王',CN:'1552~1608 · 德兴大院君之子，水落山墓域之王'},
   body:{KO:'선조는 조선 역사에서 가장 평가가 극단적으로 갈리는 왕 가운데 한 사람이다. 임진왜란을 겪은 왕으로 유명하지만, 동시에 백성을 버리고 의주까지 피난한 왕이라는 비판도 강하다. 하지만 그런 혼란 속에서도 선조에게 굉장히 중요한 장소가 있었는데, 바로 수락산 자락이었다.\n\n그 이유는 그의 아버지 덕흥대원군의 묘 때문이다.\n\n원래 선조는 왕이 될 가능성이 거의 없던 인물이었다. 그는 중종의 서자인 덕흥대원군의 아들이었다. 즉, 정통 왕세자 계통과는 거리가 멀었다.\n\n하지만 명종이 후사 없이 죽게 되면서 상황이 바뀐다.\n\n결국 방계 혈통이었던 하성군, 즉 훗날 선조가 왕위에 오르게 된다.\n\n문제는 정통성 콤플렉스였다.\n\n선조는 왕이 되었지만 늘 자신의 혈통 문제를 의식했다. 그래서 누구보다 자신의 가문과 아버지 묘역을 중요하게 여겼다.\n\n그리고 바로 그 덕흥대원군 묘가 수락산 자락에 자리하게 된다.\n\n당시 수락산 일대는 한양 북부의 명당지로 여겨졌다. 산세가 깊고 물줄기가 안정적이며, 왕실 묘역과 연결되기 좋은 풍수적 조건을 갖춘 지역이었다.\n\n선조는 왕이 된 이후에도 자주 이 일대를 찾았다고 전해진다.\n\n특히 덕흥대원군 묘를 직접 살피고 제향 문제를 챙겼다는 기록과 전승들이 이어진다.\n\n흥미로운 건 선조가 단순 효심 때문만이 아니라, 정치적으로도 이 묘역을 굉장히 중요하게 생각했다는 점이다.\n\n그에게 아버지 묘는 단순 가족 무덤이 아니었다.\n\n자신의 왕권 정통성을 상징하는 공간이었다.\n\n왜냐하면 선조는 원래 왕이 될 사람이 아니었기 때문이다.\n\n그래서 그는 더욱 자신의 혈통과 조상 문제에 민감했다.\n\n수락산이 선조 이야기에서 특별한 이유도 바로 여기에 있다.\n\n수락산은 단순 자연 공간이 아니라, 왕권과 혈통, 조선 왕실의 불안감이 함께 얽혀 있는 장소가 된 것이다.\n\n특히 선조는 임진왜란 이후 더욱 예민해진다.\n\n왜란 당시 그는 한양을 떠나 의주까지 피난했고, 백성들의 엄청난 원망을 받았다.\n\n조선 전체가 무너질 뻔한 상황 속에서 왕으로서의 권위 역시 크게 흔들렸다.\n\n그래서 전쟁 이후 선조는 더욱 왕실 권위와 왕통 문제를 신경 쓰게 된다.\n\n덕흥대원군 묘를 자주 살핀 것도 그런 불안감과 무관하지 않았다는 해석이 많다.\n\n수락산 자락의 묘역은 단순 조용한 산소가 아니라, 선조에게는 자신의 존재 이유와 연결된 장소였던 셈이다.\n\n또 당시 수락산은 지금보다 훨씬 깊고 웅장한 산이었다.\n\n왕실 묘역 주변은 일반 백성 출입이 제한되는 경우도 많았고, 관리 역시 엄격했다.\n\n후대 지역 이야기에서는 선조 행차가 지나가면 수락산 아래 분위기가 완전히 달라졌다고 전해진다.\n\n왕실 관리들과 호위 인원들이 움직이고, 주변 주민들도 긴장했다고 한다.\n\n하지만 흥미로운 건 시간이 흐르면서 수락산 속 선조 이미지가 단순 권력자의 모습만으로 남지는 않았다는 점이다.\n\n오히려 전쟁과 정치 속에서 끊임없이 불안해했던 왕의 모습이 함께 남아 있다.\n\n수락산은 이상하게 조선 역사 속 상처와 불안의 기억이 많이 쌓인 산이다.\n\n김시습은 단종의 시대에 절망했고, 인현왕후는 폐위되어 산자락과 연결되었으며, 연산군은 백성을 내쫓으며 원망을 남겼다.\n\n선조 역시 임진왜란이라는 거대한 상처와 함께 수락산에 흔적을 남긴 왕이었다.\n\n그래서 지금 수락산을 바라보면 단순히 아름다운 자연만이 아니라, 조선 왕실의 두려움과 권력의 그림자까지 함께 겹쳐지는 느낌이 남아 있는 것이다.',
         EN:'Seonjo is one of the kings in Joseon history whose reputation swings most extremely in both directions. Famous as the king who weathered the Imjin War, he is equally criticized as the king who abandoned his people and fled to Uiju. Yet amid all that turmoil, there was a place of tremendous importance to him — the foot of Suraksan.\n\nThe reason was the tomb of his father, Deokheung Daewongun. Originally Seonjo had almost no prospect of becoming king — a secondary son\'s son, far from the main line of succession. But King Myeongjong died without an heir, and Seonjo ascended the throne.\n\nA legitimacy complex haunted him. He valued his father\'s tomb above all else, and that tomb of Deokheung Daewongun was situated at the foot of Suraksan. After becoming king, Seonjo reportedly visited the area frequently — to him it was not merely a family grave, but a space symbolizing the legitimacy of his royal authority.\n\nAfter the Imjin War he grew even more sensitive. He had fled Hanyang, earning enormous resentment. Following the war he became even more attentive to royal authority and succession. The tomb precinct at Suraksan was for Seonjo a place connected to his very reason for existing.\n\nSuraksan is a mountain where memories of Joseon\'s wounds and anxieties have accumulated deeply. Seonjo too left his traces here, accompanied by the enormous wound of the Imjin War.',
         JP:'宣祖は朝鮮歴史で最も評価が両極端に分かれる王の一人だ。壬辰倭乱を経験した王として有名だが、民を捨て義州まで避難した王という批判も強い。しかしそのような混乱の中でも彼にとって重要な場所があった——水落山の麓だった。\n\n理由は父の德興大院君の墓のためだ。元々王になる可能性がほとんどなかった宣祖は、正統性コンプレックスを抱えながら誰よりも父の墓域を重要視した。そしてその墓が水落山の麓に位置することになる。\n\n王になった後もよくこの一帯を訪れたという。父の墓は単なる家族の墓ではなく、王権正統性を象徴する空間だった。壬辰倭乱後はさらに敏感になり、漢陽を離れ義州まで避難した怨恨を抱えながら王室権威をより意識するようになった。\n\n水落山は朝鮮歴史の傷と不安の記憶が多く積み重なった山だ。宣祖もまた壬辰倭乱という巨大な傷とともに水落山に足跡を残した王だった。',
         CN:'宣祖是朝鲜历史上评价最极端两极的王之一。他因经历壬辰倭乱而闻名，却同时受到「抛弃百姓逃往义州」的强烈批评。然而在那样的混乱中，他有一个极为重要的地方——水落山山脚。\n\n原因是父亲德兴大院君的墓。宣祖原本几乎没有可能成为王，背负正统性情结，比任何人都更重视父亲的墓域，而那座墓就坐落于水落山山脚。\n\n成王之后，他据说常来此地探望。父亲的墓是象征自己王权正统性的空间。壬辰倭乱后他变得更加敏感，对王室权威与王统问题更加在意。水落山山脚的墓域，是他与自己存在理由相连的地方。\n\n水落山是积淀了朝鲜历史伤痛与不安记忆的山。宣祖也带着壬辰倭乱这一巨大创伤，在水落山留下了痕迹。'}}
];;

function openStoryModal(idx){
  var modal=document.getElementById('story-modal');if(!modal)return;
  _sTab=idx||0;
  _buildStory();
  modal.style.display='flex';
  setTimeout(function(){modal.classList.add('on');},10);
}
function closeStoryModal(){
  var modal=document.getElementById('story-modal');if(!modal)return;
  modal.classList.remove('on');
  setTimeout(function(){modal.style.display='none';},300);
}
function _buildStory(){
  var L=function(o){return o[lang]||o.KO;};
  var tabs=document.getElementById('sm-tabs'),wrap=document.getElementById('sm-sw');
  if(!tabs||!wrap)return;
  tabs.innerHTML='';
  SD.forEach(function(s,i){
    var btn=document.createElement('div');btn.className='sm-tab'+(i===_sTab?' on':'');
    btn.textContent=L(s.tab);btn.onclick=function(){_switchTab(i);};tabs.appendChild(btn);
  });
  wrap.innerHTML='';wrap.style.transform='translateX(-'+(_sTab*100)+'%)';
  var _ill2=['https://machojang-create.github.io/surak-demo/cheon.png','https://machojang-create.github.io/surak-demo/kimsiseup.png','https://machojang-create.github.io/surak-demo/inhyeon.png','https://machojang-create.github.io/surak-demo/parksedang.png','https://machojang-create.github.io/surak-demo/hwanghui.png','https://machojang-create.github.io/surak-demo/leeseonggye.png','https://machojang-create.github.io/surak-demo/leehwang.png','https://machojang-create.github.io/surak-demo/yeonsangun.png','https://machojang-create.github.io/surak-demo/heungseon.png','https://machojang-create.github.io/surak-demo/jeongseon.png','https://machojang-create.github.io/surak-demo/eomheungdo.png','https://machojang-create.github.io/surak-demo/kimsatgat.png','https://machojang-create.github.io/surak-demo/jeongjo.png','https://machojang-create.github.io/surak-demo/deokhye.png','https://machojang-create.github.io/surak-demo/hanseokbong.png','https://machojang-create.github.io/surak-demo/seonjo.png'];
  SD.forEach(function(s,si){
    var story=document.createElement('div');
    story.className='sm-story';

    /* ── 이미지 배경 (완전 고정) ── */
    var illDiv=document.createElement('div');
    illDiv.className='sm-illust';
    var illSrc=_ill2[si]||'';
    if(illSrc){
      illDiv.style.backgroundImage='url('+illSrc+')';
      illDiv.style.backgroundColor='#080C14';
    } else {
      illDiv.style.background=s.bg;
      illDiv.style.fontSize='80px';
      illDiv.style.display='flex';
      illDiv.style.alignItems='center';
      illDiv.style.justifyContent='center';
      illDiv.textContent=s.ic;
    }
    /* 이미지 하단 페이드 */
    var fade=document.createElement('div');
    fade.style.cssText='position:absolute;bottom:0;left:0;right:0;height:120px;background:linear-gradient(to bottom,transparent,#080C14);pointer-events:none;';
    illDiv.appendChild(fade);
    story.appendChild(illDiv);

    /* ── 텍스트 스크롤 레이어 (이미지 위에 absolute) ── */
    var page=document.createElement('div');
    page.style.cssText='flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#080C14;margin-top:-24px;border-radius:20px 20px 0 0;';

    /* 이미지 영역 위에 고정, spacer 불필요 */

    /* 텍스트 본문 (반투명 배경) */
    var txtWrap=document.createElement('div');
    txtWrap.style.cssText='background:#080C14;padding:24px 20px 0;';

    /* 인물 이름 + 설명 */
    var nmEl=document.createElement('div');
    nmEl.style.cssText='font-size:22px;font-weight:800;color:#fff;margin-bottom:6px;text-shadow:0 1px 8px rgba(0,0,0,.8);';
    nmEl.textContent=L(s.nm);
    var subEl=document.createElement('div');
    subEl.style.cssText='font-size:12px;color:rgba(255,255,255,.75);margin-bottom:16px;text-shadow:0 1px 4px rgba(0,0,0,.8);';
    subEl.textContent=L(s.sub);

    /* 본문 */
    var bodEl=document.createElement('div');
    bodEl.className='sm-pg-body';
    bodEl.style.cssText='font-size:14px;line-height:1.85;color:rgba(255,255,255,.92);text-shadow:0 1px 3px rgba(0,0,0,.6);';
    bodEl.innerHTML=(L(s.body)).replace(/\n/g,'<br><br>');

    txtWrap.appendChild(nmEl);
    txtWrap.appendChild(subEl);
    txtWrap.appendChild(bodEl);
    page.appendChild(txtWrap);

    /* ── CTA 버튼 ── */
    var cta=document.createElement('div');
    cta.style.cssText='background:#080C14;padding:12px 20px 24px;flex-shrink:0;';
    var btn=document.createElement('button');
    btn.className='sm-cta-btn locked';btn.id='sm-cta-'+si;
    btn.textContent=L({KO:'끝까지 읽으면 EXP 획득!',EN:'Read all to earn EXP!',JP:'最後まで読むとEXP獲得！',CN:'读完获取EXP！'});
    btn.onclick=function(){_onCTA(si);};
    cta.appendChild(btn);
    page.appendChild(cta);

    /* PC 마우스 휠 스크롤 지원 */
    page.addEventListener('wheel',function(e){
      e.preventDefault();
      this.scrollTop+=e.deltaY;
    },{passive:false});
    /* 스크롤 끝 감지 */
    page.addEventListener('scroll',function(){
      if(this.scrollTop+this.clientHeight>=this.scrollHeight-20){
        var ctaEl=document.getElementById('sm-cta-'+si);
        if(ctaEl&&ctaEl.classList.contains('locked')){
          ctaEl.className='sm-cta-btn ready';
          ctaEl.textContent=L({KO:'배지 획득 + EXP 받기! ⚡',EN:'Claim Badge + EXP! ⚡',JP:'バッジ獲得+EXP！',CN:'获取徽章+EXP！'});
        }
      }
    });

    story.appendChild(page);
    wrap.appendChild(story);
  });
}
function _switchTab(i){
  _sTab=i;
  var w=document.getElementById('sm-sw');if(w)w.style.transform='translateX(-'+(i*100)+'%)';
  var t=document.getElementById('sm-tabs');if(t)t.querySelectorAll('.sm-tab').forEach(function(b,ti){b.classList.toggle('on',ti===i);});
}
function _onCTA(si){
  var s=SD[si];var L=function(o){return o[lang]||o.KO;};
  localStorage.setItem('surak_hist_'+s.badge.replace('hist_',''),'1');
  if(typeof unlockBadge==='function')unlockBadge(s.badge);
  var modal=document.getElementById('story-modal');
  if(modal){for(var i=0;i<10;i++){var p=document.createElement('div');p.className='sm-ptc';p.style.background=s.color;p.style.left=(20+Math.random()*60)+'%';p.style.bottom='60px';p.style.animationDelay=(Math.random()*0.3)+'s';modal.appendChild(p);setTimeout(function(el){el.remove();},1000,p);}}
  var cta=document.getElementById('sm-cta-'+si);
  if(cta){cta.className='sm-cta-btn done';cta.textContent='&#x2705; '+L({KO:'획득 완료!',EN:'Claimed!',JP:'獲得完了！',CN:'已获取！'});}
  if(typeof checkHistoryBadges==='function')checkHistoryBadges();
  if(!window._cpEvt){window._cpEvt=true;
    document.addEventListener('click',function(e){
      var card=e.target.closest('[data-cpid]');
      if(card){e.stopPropagation();openCouponModal(card.getAttribute('data-cpid'));}
    });
  }
  /* 게임 배너 전역 이벤트 위임 - 한 번만 등록 */
  if(!window._gameEvtRegistered){
    window._gameEvtRegistered=true;
    document.addEventListener('click',function(e){
      var card=e.target.closest('[data-gameid]');
      if(card){
        e.stopPropagation();
        /* openGameModal이 정의된 후 호출 보장 */
        if(typeof openGameModal==='function'){
          openGameModal(card.getAttribute('data-gameid'));
        } else {
          setTimeout(function(){
            if(typeof openGameModal==='function')
              openGameModal(card.getAttribute('data-gameid'));
          },200);
        }
      }
    });
  }
  var gi=document.getElementById('goods-inner');if(gi)delete gi.dataset.done;
}

function renderBadgeSection(container){
  if(!container)return;
  var L=function(o){return o[lang]||o.KO;};
  var bs=getBadgeState();
  var unlocked=BADGE_DEFS.filter(function(b){return bs[b.id];}).length;
  var h='<div class="badge-section">';
  // 수집 현황
  h+='<div style="background:var(--sf);border:1px solid var(--bd);border-radius:var(--r3);padding:12px 14px;margin-bottom:4px;display:flex;align-items:center;gap:12px;box-shadow:var(--s1);">';
  h+='<div style="font-size:28px;">🏅</div>';

  h+='<div style="font-size:11px;color:var(--t3);margin-top:2px;">'+unlocked+'/16 '+L({KO:'수집',EN:'collected',JP:'収集',CN:'已收集'})+'</div>';
  h+='<div style="height:3px;background:var(--bd);border-radius:2px;margin-top:6px;">';
  h+='<div style="height:100%;width:'+(unlocked/16*100)+'%;background:var(--ac);border-radius:2px;transition:width .6s;"></div></div></div></div>';
  // 카테고리별 배지
  ['history','hiking','gourmet','night'].forEach(function(cat){
    var ci=_CAT_INFO[cat];
    var catBadges=BADGE_DEFS.filter(function(b){return b.cat===cat;});
    h+='<div class="badge-cat-title">'+ci.ic+' '+L(ci.nm)+'</div>';
    h+='<div class="badge-grid">';
    catBadges.forEach(function(badge){
      var owned=!!bs[badge.id];
      var gc=_GRADE_COLOR[badge.grade];
      h+='<div class="badge-card '+(owned?'unlocked':'locked')+' grade-'+badge.grade+'" data-badge-id="'+badge.id+'">';
      h+='<span class="badge-card-grade">'+(L(_GRADE_NM[badge.grade]))+'</span>';
      h+='<span class="badge-card-ic">'+(owned?badge.icon:'❓')+'</span>';
      h+='<div class="badge-card-nm">'+(owned?L(badge.nm):L({KO:'???',EN:'???',JP:'???',CN:'???'}))+'</div>';
      if(owned&&bs[badge.id].unlockedAt)h+='<div class="badge-card-date">'+bs[badge.id].unlockedAt+'</div>';
      h+='</div>';
    });
    h+='</div>';
  });
  h+='</div>';
  container.innerHTML=h;
  // 클릭 → 상세 팝업
  container.querySelectorAll('.badge-card').forEach(function(card){
    card.addEventListener('click',function(){openBadgeDetail(this.dataset.badgeId);});
  });
}

function openBadgeDetail(id){
  var badge=BADGE_DEFS.find(function(b){return b.id===id;});
  if(!badge)return;
  var L=function(o){return o[lang]||o.KO;};
  var bs=getBadgeState();
  var owned=!!bs[id];
  var gc=_GRADE_COLOR[badge.grade];
  var pop=document.getElementById('badge-detail-pop');if(!pop)return;
  var ic=document.getElementById('bdp-ic');if(ic)ic.textContent=owned?badge.icon:'❓';
  var grade=document.getElementById('bdp-grade');
  if(grade){grade.textContent=L(_GRADE_NM[badge.grade]);grade.style.color=gc;}
  var nm=document.getElementById('bdp-nm');
  if(nm){nm.textContent=owned?L(badge.nm):L({KO:'미획득 배지',EN:'Locked Badge',JP:'未獲得バッジ',CN:'未获得徽章'});}
  var desc=document.getElementById('bdp-desc');
  if(desc)desc.textContent=L(badge.desc);
  var cond=document.getElementById('bdp-cond');
  if(cond)cond.textContent=L({KO:'획득 조건: ',EN:'Condition: ',JP:'取得条件: ',CN:'获取条件: '})+L(badge.cond||badge.desc);
  var date=document.getElementById('bdp-date');
  if(date)date.textContent=owned&&bs[id].unlockedAt?L({KO:'획득일: ',EN:'Unlocked: ',JP:'取得日: ',CN:'获取日期: '})+bs[id].unlockedAt:'';
  pop.style.display='flex';setTimeout(function(){pop.classList.add('on');},10);
}
function closeBadgeDetail(){
  var pop=document.getElementById('badge-detail-pop');if(!pop)return;
  pop.classList.remove('on');setTimeout(function(){pop.style.display='none';},300);
}

function renderDokkamSection(container){
  if(!container)return;
  var L=function(o){return o[lang]||o.KO;};
  var visits=getStoreVisits();
  var visited=STORES.filter(function(s){return visits[s.id]>0;});
  var h='';
  // 헤더
  h+='<div style="background:var(--sf);border:1px solid var(--bd);border-radius:var(--r3);padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;box-shadow:var(--s1);">';
  h+='<div style="font-size:28px;">🏪</div>';
  h+='<div style="flex:1;"><div style="font-size:13px;font-weight:800;color:var(--t1);">'+L({KO:'단골 도감',EN:'Store Records',JP:'常連図鑑',CN:'老顾客图鉴'})+'</div>';
  h+='<div style="font-size:11px;color:var(--t3);margin-top:2px;">'+visited.length+'/'+STORES.length+' '+L({KO:'매장 방문',EN:'stores visited',JP:'店舗訪問',CN:'家店铺已访问'})+'</div>';
  h+='<div style="height:3px;background:var(--bd);border-radius:2px;margin-top:6px;">';
  h+='<div style="height:100%;width:'+(visited.length/STORES.length*100)+'%;background:var(--am);border-radius:2px;transition:width .6s;"></div></div></div></div>';
  if(visited.length===0){
    h+='<div style="text-align:center;padding:24px;background:var(--sf);border-radius:var(--r3);border:1px solid var(--bd);">';
    h+='<div style="font-size:36px;margin-bottom:8px;">🏪</div>';
    h+='<div style="font-size:13px;color:var(--t3);">'+L({KO:'지도 탭에서 매장을 탭하면 방문 기록이 쌓여요!',EN:'Tap stores on the map to build your records!',JP:'地図タブで店舗をタップすると記録が積まれます！',CN:'在地图标签点击店铺即可积累记录！'})+'</div></div>';
  }else{
    visited.sort(function(a,b){return (visits[b.id]||0)-(visits[a.id]||0);});
    visited.forEach(function(s){
      var count=visits[s.id]||0;
      var grade=getVisitBadgeGrade(count);
      var nm=lang==='EN'?s.en:lang==='JP'?s.jp:lang==='CN'?s.cn:s.ko;
      var col=grade?grade.color:'var(--bd)';
      var maxPips=10; var fillPips=Math.min(count,maxPips);
      h+='<div class="dokkam-card">';
      h+='<div class="dokkam-grade-bar" style="background:'+col+'"></div>';
      h+='<div class="dokkam-ic">'+(grade?grade.icon:'🏠')+'</div>';
      h+='<div class="dokkam-info">';
      h+='<div class="dokkam-nm">'+nm+'</div>';
      if(grade)h+='<div class="dokkam-grade-nm" style="color:'+col+';">'+(grade.nm[lang]||grade.nm.KO)+'</div>';
      h+='<div class="dokkam-cnt">'+count+L({KO:'회 방문',EN:' visits',JP:'回訪問',CN:'次到访'})+'</div>';
      h+='<div class="dokkam-pips">';
      for(var i=0;i<maxPips;i++)h+='<div class="dokkam-pip'+(i<fillPips?' fill':'')+'"'+(i<fillPips?' style="background:'+col+';"':'')+'""></div>';
      h+='</div></div></div>';
    });
    var left=STORES.length-visited.length;
    if(left>0)h+='<div style="text-align:center;font-size:11px;color:var(--t3);padding:10px;">'+L({KO:'아직 '+left+'개 매장을 방문하지 않았어요',EN:left+' stores left to discover',JP:'まだ'+left+'店舗を訪問していません',CN:'还有'+left+'家店铺未探索'})+'</div>';
  }
  container.innerHTML=h;
}

/* ═══ 탭 전환 ═══ */
function sv(v){
  document.querySelectorAll('.view').forEach(function(el){el.classList.remove('on');});
  document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('on');});
  var ve=g(v+'-view');if(ve)ve.classList.add('on');
  var te=document.querySelector('[data-v="'+v+'"]');if(te)te.classList.add('on');
  if(v==='map'){
    if(_mapReady&&!_map){
      _initMap();
    } else if(_map){
      setTimeout(function(){naver.maps.Event.trigger(_map,'resize');},150);
      renderMapList();
    } else {
      // 네이버 지도 아직 로딩 중 - 대기 후 재시도
      var _mapWait=0;
      var _mapTimer=setInterval(function(){
        _mapWait++;
        if(_mapReady&&!_map){clearInterval(_mapTimer);_initMap();}
        else if(_map){clearInterval(_mapTimer);setTimeout(function(){naver.maps.Event.trigger(_map,'resize');},150);renderMapList();}
        else if(_mapWait>20)clearInterval(_mapTimer);
      },200);
    }
  }
  if(v==='home')renderHome();
  if(v==='goods')renderGoods();
  if(v==='sound')renderSound();
  if(v==='my'){var mi=g('my-inner');if(mi)delete mi.dataset.done;renderMy();}
}

/* ═══ 네이버 지도 콜백 ═══ */
window.naverMapInit=function(){
  _mapReady=true;
  if(g('map-view')&&g('map-view').classList.contains('on'))_initMap();
};

/* ═══ 초기화 ═══ */
document.addEventListener('DOMContentLoaded',function(){
  document.querySelectorAll('.tab').forEach(function(btn){
    btn.addEventListener('click',function(){sv(this.dataset.v);});
  });
  document.querySelectorAll('.lang-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      lang=this.dataset.lang;
      document.querySelectorAll('.lang-btn').forEach(function(b){b.classList.remove('on');});
      this.classList.add('on');
      ['goods-inner','sound-inner'].forEach(function(id){var el=g(id);if(el)delete el.dataset.done;});
      var mi=g('my-inner');if(mi)delete mi.dataset.done;
      applyT();
      if(_map)_buildMapFilter();
      var cur=document.querySelector('.tab.on');if(!cur)return;
      var v=cur.dataset.v;
      if(v==='home')renderHome();
      else if(v==='goods')renderGoods();
      else if(v==='sound')renderSound();
      else if(v==='my'){var mi2=g('my-inner');if(mi2)delete mi2.dataset.done;renderMy();}
      else if(v==='info'){var ii2=g('info-inner');if(ii2)delete ii2.dataset.done;renderInfo();}
    });
  });
  var popX=g('pop-x');if(popX)popX.onclick=closePopup;
  var pop=g('pop');if(pop)pop.addEventListener('click',function(e){if(e.target===this)closePopup();});
  var hp=g('home-popup');if(hp)hp.addEventListener('click',function(e){if(e.target===this)closeHomePopup();});
  applyT();
  renderHome();
  // 챗봇 Enter 키
  var chatInput=g('chat-input');
  if(chatInput){chatInput.addEventListener('keydown',function(e){if(e.key==='Enter')sendChat();});}
  setTimeout(function(){showGuideTip();setInterval(showGuideTip,32000);},15000);
});

function openGameModal(gameId){

    +'<button id="_gClose" style="background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;">✕ 닫기</button>';
  modal.appendChild(hdr);
  var body=document.createElement('div');
  body.style.cssText='flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;';
  var styleEl=document.createElement('style');
  styleEl.id='_gStyle';
  styleEl.textContent=_d(gd[0]);
  document.head.appendChild(styleEl);
  body.innerHTML=_d(gd[1]);
  modal.appendChild(body);
  document.body.appendChild(modal);
  setTimeout(function(){
    try{(new Function(_d(gd[2])))();}
    catch(e){console.warn('game:',e.message);}
  },80);
  document.getElementById('_gClose').addEventListener('click',function(){
    var s=document.getElementById('_gStyle');if(s)s.parentNode.removeChild(s);
    modal.parentNode.removeChild(modal);
    renderHome();
  });
}

    html+='<div style="font-size:32px;">'+cp.ic+'</div>';
    html+='<div style="flex:1;"><div style="font-size:14px;font-weight:800;color:var(--t1);margin-bottom:2px;">'+L(cp.nm)+'</div>';
    html+='<div style="font-size:12px;color:var(--t3);">'+cp.pt.toLocaleString()+' P · '+cp.stores.length+' '+L({KO:'개 매장',EN:'stores',JP:'店舗',CN:'家店铺'})+'</div></div>';
    if(used){
      html+='<div style="font-size:11px;font-weight:700;color:var(--t3);">✅ 사용완료</div>';
    } else {
      html+='<button data-cpid="'+cp.id+'" style="background:'+(canBuy?'var(--ac)':'var(--t3)')+';color:#fff;border:none;border-radius:var(--r2);padding:7px 12px;font-size:12px;font-weight:700;cursor:'+(canBuy?'pointer':'not-allowed')+';white-space:nowrap;">'+(canBuy?L({KO:'교환',EN:'Exchange',JP:'交換',CN:'兑换'}):(getPoints().total<cp.pt?L({KO:'P부족',EN:'Low P',JP:'P不足',CN:'P不足'}):L({KO:'오늘완료',EN:'Done today',JP:'今日完了',CN:'今日完成'})))+'</button>';
    }
    html+='</div></div>';
  });
  if(!html) html='<div style="padding:16px;text-align:center;font-size:12px;color:var(--t3);">포인트를 모아 쿠폰을 교환하세요!</div>';
  wrap.innerHTML = html;
  /* 쿠폰 교환 클릭 */
  wrap.querySelectorAll('button[data-cpid]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var cpid=this.getAttribute('data-cpid');
      openCouponModal(cpid);
    });
  });
}

/* ── 쿠폰 모달 ── */
var _activeCp=null, _selStore=null, _pinVal='', _pinTry=0, _tsInt=null;

function openCouponPage(){
  /* 마이탭 쿠폰 섹션으로 스크롤 */
  var el=document.getElementById('my-coupon-wrap');
  if(el) el.scrollIntoView({behavior:'smooth'});
}

function openCouponModal(cpid){
  var cp=null;
  for(var i=0;i<GAME_COUPONS.length;i++){if(GAME_COUPONS[i].id===cpid){cp=GAME_COUPONS[i];break;}}
  if(!cp)return;
  var L=function(o){return o[lang]||o.KO;};
  /* 포인트/일일 체크는 직원확인 단계에서 처리 */
  _activeCp=cp; _selStore=null;

  /* 모달 생성 */
  var existing=document.getElementById('_gameCpModal');
  if(existing) existing.parentNode.removeChild(existing);

  var modal=document.createElement('div');
  modal.id='_gameCpModal';
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9000;display:flex;align-items:flex-end;justify-content:center;';

  var storeHtml='';
  cp.stores.forEach(function(s){
    storeHtml+='<div data-sid="'+s.id+'" style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r2);margin-bottom:6px;cursor:pointer;">'
      +'<div style="width:8px;height:8px;border-radius:50%;background:'+s.color+';flex-shrink:0;"></div>'
      +'<div style="flex:1;"><div style="font-size:13px;font-weight:600;">'+s.nm+'</div>'
      +'<div style="font-size:10px;color:var(--t3);">'+s.addr+'</div></div>'
      +'<div style="font-size:12px;color:var(--t3);">›</div></div>';
  });

  modal.innerHTML='<div style="background:var(--sf);border-radius:24px 24px 0 0;width:100%;max-width:430px;padding:20px 20px 40px;max-height:88vh;overflow-y:auto;">'
    +'<div style="width:40px;height:4px;background:var(--bd);border-radius:2px;margin:0 auto 16px;"></div>'
    +'<div style="background:linear-gradient(135deg,#1a3a5c,#0d1f3c);border-radius:12px;padding:16px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden;">'
    +'<div id="_cpWm" style="position:absolute;inset:0;opacity:.06;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;animation:wmMove 4s linear infinite;">수락스트릿 · SURAK STREET · '.repeat(20)+'</div>'
    +'<div style="position:absolute;bottom:8px;right:10px;font-size:11px;font-weight:800;opacity:.6;" id="_cpTs">--:--:--</div>'
    +'<div style="font-size:18px;font-weight:800;position:relative;margin-bottom:4px;">'+cp.ic+' '+L(cp.nm)+'</div>'
    +'<div style="font-size:22px;font-weight:800;position:relative;color:#FFD700;">'+cp.pt.toLocaleString()+' P</div>'
    +'</div>'
    +'<div style="font-size:12px;font-weight:700;color:var(--t2);margin-bottom:8px;">📍 '+L({KO:'교환 가능 매장 (탭하여 선택)',EN:'Select a store',JP:'店舗を選択',CN:'选择门店'})+'</div>'
    +'<div id="_cpStores">'+storeHtml+'</div>'
    +'<button id="_cpStaffBtn" style="width:100%;padding:14px;border-radius:var(--r3);background:var(--t3);border:none;color:#fff;font-size:15px;font-weight:800;cursor:not-allowed;margin-bottom:8px;margin-top:4px;">📍 '+L({KO:'매장을 먼저 선택해주세요',EN:'Select a store first',JP:'店舗を選択してください',CN:'请先选择门店'})+'</button>'
    +'<button id="_cpCancelBtn" style="width:100%;padding:12px;border-radius:var(--r3);background:transparent;border:1px solid var(--bd);font-size:14px;color:var(--t2);cursor:pointer;">'+L({KO:'닫기',EN:'Close',JP:'閉じる',CN:'关闭'})+'</button>'
    +'</div>';

  document.body.appendChild(modal);

  /* 타임스탬프 */
  function uTs(){var n=new Date(),el=document.getElementById('_cpTs');if(!el)return;var h=n.getHours(),m=n.getMinutes(),s=n.getSeconds();el.textContent=(h<10?'0':'')+h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
  uTs(); _tsInt=setInterval(uTs,1000);

  /* 배경 클릭 닫기 */
  modal.addEventListener('click',function(e){if(e.target===modal)closeCouponModal();});
  document.getElementById('_cpCancelBtn').addEventListener('click',closeCouponModal);

  /* 매장 선택 */
  document.getElementById('_cpStores').querySelectorAll('[data-sid]').forEach(function(item){
    item.addEventListener('click',function(){
      document.getElementById('_cpStores').querySelectorAll('[data-sid]').forEach(function(x){
        x.style.borderColor='var(--bd)'; x.style.background='var(--sf2)';
      });
      this.style.borderColor='var(--ac)'; this.style.background='rgba(44,74,30,.06)';
      var sid=this.getAttribute('data-sid');
      _activeCp.stores.forEach(function(s){if(s.id===sid)_selStore=s;});
      var sb=document.getElementById('_cpStaffBtn');
      sb.style.background='var(--ac)'; sb.style.cursor='pointer';
      sb.textContent='👨‍💼 '+_selStore.nm+' '+{KO:'직원 확인',EN:'Staff Verify',JP:'スタッフ確認',CN:'员工确认'}[lang];
    });
  });

  /* 직원확인 버튼 */
  document.getElementById('_cpStaffBtn').addEventListener('click',function(){
    if(!_selStore)return;
    if(!gameIsUsed(_activeCp.id)){
      if(!gameCanEx()){showGameAlert('오늘은 이미 쿠폰을 교환했어요!');return;}
      if((getPoints().total||0)<_activeCp.pt){showGameAlert('포인트가 부족해요. 현재: '+(getPoints().total||0)+' P / 필요: '+_activeCp.pt+' P');return;}
      showGameConfirm(_activeCp.ic+' '+L(_activeCp.nm), _activeCp.pt.toLocaleString()+' P를 사용할까요?', function(){
        addPoint(-_activeCp.pt,L(_activeCp.nm)+' 쿠폰 교환','🎟️');
        gameMarkEx();
        openPinModal();
      });
      return;
    }
    openPinModal();
  });
}

function closeCouponModal(){
  if(_tsInt){clearInterval(_tsInt);_tsInt=null;}
  var m=document.getElementById('_gameCpModal');
  if(m)m.parentNode.removeChild(m);
  _activeCp=null;_selStore=null;
}

/* ── PIN 모달 ── */
function openPinModal(){
  var L=function(o){return o[lang]||o.KO;};
  var existing=document.getElementById('_pinModal');
  if(existing)existing.parentNode.removeChild(existing);
  _pinVal='';_pinTry=0;

  var pm=document.createElement('div');
  pm.id='_pinModal';
  pm.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9100;display:flex;align-items:center;justify-content:center;';
  pm.innerHTML='<div style="background:var(--sf);border-radius:20px;width:290px;padding:24px 20px;text-align:center;">'
    +'<div style="font-size:16px;font-weight:800;margin-bottom:4px;">🔒 매장 PIN 확인</div>'
    +'<div style="font-size:11px;color:var(--t3);margin-bottom:16px;line-height:1.5;white-space:pre-line;">'+_selStore.nm+'\n직원이 PIN 4자리를 입력해주세요</div>'
    +'<div style="display:flex;justify-content:center;gap:10px;margin-bottom:12px;" id="_pinDots">'
    +'<div id="_pd0" style="'+_pdStyle()+'"></div><div id="_pd1" style="'+_pdStyle()+'"></div>'
    +'<div id="_pd2" style="'+_pdStyle()+'"></div><div id="_pd3" style="'+_pdStyle()+'"></div>'
    +'</div>'
    +'<div style="font-size:11px;color:#c00;font-weight:700;min-height:16px;margin-bottom:10px;" id="_pinMsg"></div>'
    +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;">'
    +[1,2,3,4,5,6,7,8,9,'del',0,'x'].map(function(k){
      return '<button data-pk="'+k+'" style="height:50px;border-radius:8px;background:var(--sf2);border:1px solid var(--bd);font-size:18px;font-weight:700;cursor:pointer;">'+(k==='del'?'⌫':k==='x'?'✕':k)+'</button>';
    }).join('')
    +'</div>'
    +'<button id="_pinCloseBtn" style="width:100%;padding:11px;border-radius:8px;background:transparent;border:1px solid var(--bd);font-size:13px;color:var(--t2);cursor:pointer;">취소</button>'
    +'</div>';
  document.body.appendChild(pm);
  pm.querySelectorAll('[data-pk]').forEach(function(btn){
    btn.addEventListener('click',function(){_doPIN(this.getAttribute('data-pk'));});
  });
  document.getElementById('_pinCloseBtn').addEventListener('click',closePinModal);
}
function _pdStyle(filled,err){
  return 'width:42px;height:42px;border-radius:8px;background:'+(err?'rgba(139,42,42,.1)':(filled?'var(--ac)':'var(--sf2)'))+';border:2px solid '+(err?'#c00':(filled?'var(--ac)':'var(--bd)'))+';display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;';
}
function _renderPIN(err){
  for(var i=0;i<4;i++){
    var d=document.getElementById('_pd'+i);
    if(!d)return;
    var filled=_pinVal.length>i;
    d.style.cssText=_pdStyle(filled,err);
    d.textContent=filled?'●':'';
  }
}
function _doPIN(k){
  if(k==='x'||k==='del'){_pinVal=_pinVal.slice(0,-1);document.getElementById('_pinMsg').textContent='';}
  else if(/[0-9]/.test(k)&&_pinVal.length<4){
    _pinVal+=k;
    if(_pinVal.length===4)setTimeout(_verifyPIN,150);
  }
  _renderPIN();
}
function _verifyPIN(){
  var L=function(o){return o[lang]||o.KO;};

  if(!_selStore)return;
  if(_pinVal===_selStore.pin){
    closePinModal();
    gameMarkUsed(_activeCp.id);
    /* 사용완료 UI 업데이트 */
    var bg=document.querySelector('#_gameCpModal .use-bg');
    if(bg)bg.style.filter='grayscale(1)';
    var sb=document.getElementById('_cpStaffBtn');
    if(sb){sb.textContent='✅ '+L({KO:'사용 완료',EN:'Used',JP:'使用済み',CN:'已使用'});sb.disabled=true;sb.style.background='var(--t3)';}
    /* 마이탭 쿠폰 다시 렌더 */
    var mw=document.getElementById('my-coupon-wrap');
    if(mw)renderMyCoupons(mw);
    closeCouponModal();
    showGameAlert('✅ 쿠폰 사용 완료!\n즐거운 식사 되세요 🍽️');
  } else {
    _pinTry++;_pinVal='';_renderPIN(true);
    document.getElementById('_pinMsg').textContent=_pinTry>=3?'❌ 3회 오류. 잠시 후 시도하세요.':'❌ PIN 불일치 ('+(3-_pinTry)+'회 남음)';
    if(_pinTry>=3)setTimeout(closePinModal,2000);
  }
}
function closePinModal(){var m=document.getElementById('_pinModal');if(m)m.parentNode.removeChild(m);_pinVal='';}

/* ── 커스텀 Alert/Confirm ── */
function showGameAlert(msg,onOk){
  var d=document.createElement('div');
  d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9200;display:flex;align-items:center;justify-content:center;';
  d.addEventListener('click',function(e){e.stopPropagation();});
  d.innerHTML='<div style="background:var(--sf);border-radius:16px;width:280px;padding:24px 20px;text-align:center;">'
    +'<div style="font-size:14px;color:var(--t1);line-height:1.7;white-space:pre-line;margin-bottom:20px;">'+msg+'</div>'
    +'<button style="width:100%;padding:12px;border-radius:8px;background:var(--ac);border:none;color:#fff;font-size:14px;font-weight:700;cursor:pointer;">확인</button>'
    +'</div>';
  document.body.appendChild(d);
  d.querySelector('button').addEventListener('click',function(){d.parentNode.removeChild(d);if(onOk)onOk();});
}
function showGameConfirm(title,msg,onOk){
  var d=document.createElement('div');
  d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9200;display:flex;align-items:center;justify-content:center;';
  d.innerHTML='<div style="background:var(--sf);border-radius:16px;width:280px;padding:24px 20px;text-align:center;">'
    +'<div style="font-size:15px;font-weight:800;margin-bottom:8px;">'+title+'</div>'
    +'<div style="font-size:13px;color:var(--t2);line-height:1.7;white-space:pre-line;margin-bottom:20px;">'+msg+'</div>'
    +'<div style="display:flex;gap:8px;">'
    +'<button id="_cfCancelBtn" style="flex:1;padding:12px;border-radius:8px;background:transparent;border:1px solid var(--bd);font-size:14px;color:var(--t2);cursor:pointer;">취소</button>'
    +'<button id="_cfOkBtn" style="flex:1;padding:12px;border-radius:8px;background:var(--ac);border:none;color:#fff;font-size:14px;font-weight:700;cursor:pointer;">확인</button>'
    +'</div></div>';
  document.body.appendChild(d);
  d.querySelector('#_cfOkBtn').addEventListener('click',function(){d.parentNode.removeChild(d);if(onOk)onOk();});
  d.querySelector('#_cfCancelBtn').addEventListener('click',function(){d.parentNode.removeChild(d);});
}
