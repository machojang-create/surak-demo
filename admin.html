<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>수락스트릿 관리자</title>
<style>
:root{
  --bg:#F7F9F4;--sf:#FFFFFF;--bd:#D6E4CC;--t1:#1A2614;--t2:#4A5E40;--t3:#8A9E80;
  --ac:#2D7A2D;--acbg:rgba(45,122,45,.08);--re:#C0392B;--am:#8B6B2A;
  --r2:10px;--r3:16px;--s1:0 2px 8px rgba(0,0,0,.06);--s2:0 4px 16px rgba(0,0,0,.10);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  background:var(--bg);color:var(--t1);font-size:14px;line-height:1.5;padding:0 0 60px;}
button{font-family:inherit;cursor:pointer;}
.btn{padding:9px 16px;border-radius:8px;border:none;background:var(--ac);color:#fff;font-weight:700;font-size:13px;}
.btn.ghost{background:transparent;border:1px solid var(--bd);color:var(--t2);}
.btn.danger{background:var(--re);}
.btn:disabled{opacity:.5;cursor:default;}
input,select,textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;width:100%;background:#fff;}
label{display:block;font-size:12px;color:var(--t2);font-weight:600;margin:10px 0 4px;}

/* 로그인 게이트 */
#login-gate{max-width:380px;margin:80px auto;background:var(--sf);border-radius:var(--r3);padding:36px 28px;text-align:center;box-shadow:var(--s2);}
#login-gate h1{font-size:20px;margin-bottom:6px;}
#login-gate p{color:var(--t2);font-size:13px;margin-bottom:20px;line-height:1.7;}
#gate-msg{margin-top:14px;font-size:12px;color:var(--re);min-height:16px;}

/* 관리자 패널 */
#admin-panel{max-width:860px;margin:0 auto;}
header.adm{background:var(--sf);border-bottom:1px solid var(--bd);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--s1);position:sticky;top:0;z-index:10;}
header.adm .ttl{font-size:16px;font-weight:800;}
header.adm .who{font-size:12px;color:var(--t3);}
.wrap{padding:20px;}
.sec{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r3);padding:18px;margin-bottom:18px;}
.sec h2{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.sec h2 .cnt{font-size:12px;color:var(--t3);font-weight:600;}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}

/* 매장 리스트 */
.st-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--bd);border-radius:var(--r2);margin-bottom:8px;}
.st-row .id{font-size:11px;color:var(--t3);width:30px;flex-shrink:0;}
.st-row .nm{font-weight:700;flex:1;min-width:0;}
.st-row .nm small{font-weight:400;color:var(--t3);display:block;font-size:11px;}
.st-row .tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--acbg);color:var(--ac);}
.st-row .tag.off{background:#f0f0f0;color:#999;}
.st-row .acts{display:flex;gap:6px;flex-shrink:0;}
.st-row .acts button{padding:6px 10px;font-size:12px;border-radius:6px;border:1px solid var(--bd);background:#fff;color:var(--t2);}

/* 모달 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 14px;}
.modal.on{display:flex;}
.modal .card{background:#fff;border-radius:var(--r3);width:100%;max-width:460px;padding:22px;box-shadow:var(--s2);}
.modal .card h3{font-size:16px;margin-bottom:6px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.modal .foot{display:flex;gap:8px;margin-top:18px;}
.modal .foot .btn{flex:1;}
#qr-box{display:flex;justify-content:center;padding:18px;background:#fff;}
.hint{font-size:12px;color:var(--t3);margin-top:6px;line-height:1.6;}
</style>
</head>
<body>

<!-- 운영자 로그인 게이트 -->
<div id="login-gate">
  <h1>🛠️ 수락스트릿 관리자</h1>
  <p>운영자 계정으로 로그인해주세요.<br/>(승인된 운영자만 접근할 수 있습니다)</p>
  <button class="btn" onclick="admLogin()">구글로 로그인</button>
  <div id="gate-msg"></div>
</div>

<!-- 관리자 패널 -->
<div id="admin-panel" style="display:none">
  <header class="adm">
    <div>
      <div class="ttl">🛠️ 수락스트릿 관리자</div>
      <div class="who" id="adm-who"></div>
    </div>
    <button class="btn ghost" onclick="admLogout()">로그아웃</button>
  </header>
  <div class="wrap">
    <!-- 매장 관리 -->
    <div class="sec">
      <h2>🏪 매장 관리 <span class="cnt" id="store-count"></span></h2>
      <div class="bar">
        <button class="btn" onclick="openStoreForm()">+ 매장 추가</button>
        <button class="btn ghost" id="seed-btn" onclick="seedStores()">기존 51개 매장 가져오기(시드)</button>
        <button class="btn ghost" onclick="loadStores()">새로고침</button>
      </div>
      <div id="store-list"><div class="hint">불러오는 중...</div></div>
    </div>

    <!-- 쿠폰 관리 (§4.4) -->
    <div class="sec">
      <h2>🎟️ 쿠폰 관리 <span class="cnt" id="coupon-count"></span></h2>
      <div class="bar">
        <button class="btn" onclick="openCouponForm()">+ 쿠폰 추가</button>
        <button class="btn ghost" onclick="loadCoupons()">새로고침</button>
      </div>
      <div id="coupon-list"><div class="hint">불러오는 중...</div></div>
    </div>

    <!-- XP/레벨 정책 (§4.6) -->
    <div class="sec">
      <h2>⚙️ XP / 레벨 정책 <span class="cnt">🔥 운영 핵심</span></h2>
      <div class="grid2">
        <div><label>QR 스캔 XP (메인)</label><input id="pol-scanXp" type="number"/></div>
        <div><label>매장 방문 XP</label><input id="pol-visitXp" type="number"/></div>
        <div><label>쿠폰 사용 XP</label><input id="pol-couponXp" type="number"/></div>
        <div><label>코스 완료 XP</label><input id="pol-courseXp" type="number"/></div>
        <div><label>GPS 반경 (m)</label><input id="pol-gpsRadiusM" type="number"/></div>
        <div><label>재스캔 제한 (분)</label><input id="pol-rescanMinutes" type="number"/></div>
      </div>
      <label>전체 레벨 테이블 (쉼표 구분, 예: 0,50,150,350,700,1200,2000)</label><input id="pol-levelTable"/>
      <label>매장 레벨 테이블 (쉼표 구분, 예: 0,100,300,700)</label><input id="pol-storeLevelTable"/>
      <div class="bar" style="margin-top:12px;">
        <button class="btn" id="pol-save" onclick="savePolicy()">정책 저장</button>
        <button class="btn ghost" onclick="loadPolicy()">새로고침</button>
      </div>
      <div class="hint" id="pol-msg"></div>
    </div>
  </div>
</div>

<!-- 매장 추가/수정 모달 -->
<div class="modal" id="store-modal">
  <div class="card">
    <h3 id="sf-title">매장 추가</h3>
    <div class="hint" id="sf-hint">QR은 매장 ID 기준으로 생성됩니다.</div>
    <input type="hidden" id="sf-orig-id"/>
    <div class="grid2">
      <div><label>매장 ID (숫자, 고유)</label><input id="sf-id" type="number" placeholder="예: 52"/></div>
      <div><label>카테고리</label>
        <select id="sf-cat"><option value="food">식당</option><option value="cafe">카페</option><option value="gogi">고기</option><option value="bar">주점</option><option value="outdoor">아웃도어</option><option value="etc">기타</option></select>
      </div>
    </div>
    <label>매장명 (한국어)</label><input id="sf-name" placeholder="오공김밥 수락산점"/>
    <div class="grid2">
      <div><label>위도 (lat)</label><input id="sf-lat" type="number" step="0.000001" placeholder="37.6749"/></div>
      <div><label>경도 (lng)</label><input id="sf-lng" type="number" step="0.000001" placeholder="127.058394"/></div>
    </div>
    <div class="grid2">
      <div><label>전화번호</label><input id="sf-phone" placeholder="02-000-0000"/></div>
      <div><label>영업시간</label><input id="sf-hours" placeholder="11:00~22:00"/></div>
    </div>
    <label>주소</label><input id="sf-addr" placeholder="서울 노원구 ..."/>
    <label>설명</label><textarea id="sf-desc" rows="2" placeholder="매장 소개"></textarea>
    <div class="grid2" style="margin-top:10px;">
      <label style="display:flex;align-items:center;gap:6px;margin:0;"><input type="checkbox" id="sf-visible" style="width:auto;" checked/> 노출(공개)</label>
      <label style="display:flex;align-items:center;gap:6px;margin:0;"><input type="checkbox" id="sf-onuri" style="width:auto;"/> 온누리 가맹</label>
    </div>
    <div class="foot">
      <button class="btn ghost" onclick="closeStoreForm()">취소</button>
      <button class="btn" id="sf-save" onclick="saveStore()">저장</button>
    </div>
  </div>
</div>

<!-- QR 모달 -->
<div class="modal" id="qr-modal">
  <div class="card" style="max-width:340px;text-align:center;">
    <h3 id="qr-title">QR 코드</h3>
    <div class="hint" id="qr-url"></div>
    <div id="qr-box"></div>
    <div class="hint">이 QR을 매장에 부착하면, 손님이 스캔 → 방문 적립됩니다.</div>
    <div class="foot">
      <button class="btn ghost" onclick="closeQR()">닫기</button>
      <button class="btn" onclick="downloadQR()">PNG 다운로드</button>
    </div>
  </div>
</div>

<!-- 쿠폰 추가/수정 모달 -->
<div class="modal" id="coupon-modal">
  <div class="card">
    <h3 id="cf-title">쿠폰 추가</h3>
    <input type="hidden" id="cf-id"/>
    <div class="grid2">
      <div><label>제목</label><input id="cf-title-in" placeholder="음료 1잔 무료"/></div>
      <div><label>아이콘(이모지)</label><input id="cf-icon" placeholder="🥤" maxlength="2"/></div>
    </div>
    <label>적용 매장</label>
    <select id="cf-store"><option value="">전체 매장</option></select>
    <label>설명/조건</label><input id="cf-desc" placeholder="5,000원 이상 주문 시"/>
    <div class="grid2">
      <div><label>유효기간(까지)</label><input id="cf-until" type="date"/></div>
      <div><label>사용 PIN</label><input id="cf-pin" placeholder="1234" maxlength="6"/></div>
    </div>
    <label>사용 한도(횟수, 0=무제한)</label><input id="cf-limit" type="number" value="0"/>
    <label style="display:flex;align-items:center;gap:6px;margin-top:10px;"><input type="checkbox" id="cf-visible" style="width:auto;" checked/> 노출(공개)</label>
    <div class="foot">
      <button class="btn ghost" onclick="closeCouponForm()">취소</button>
      <button class="btn" id="cf-save" onclick="saveCoupon()">저장</button>
    </div>
  </div>
</div>

<!-- Firebase + QR 라이브러리 + 데이터 + 관리자 로직 -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
<script src="js/data.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
